name: Freeze ProcureHarness Phase 1 Search Summary v0.1

on:
  push:
    branches:
      - 'codex/procureharness-phase1-summary-v0.1'
    paths:
      - '.github/workflows/procureharness-phase1-summary-v0.1.yml'

permissions:
  contents: write

concurrency:
  group: procureharness-phase1-summary-v0.1
  cancel-in-progress: false

jobs:
  summary:
    name: Freeze Phase 1 search termination summary
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate frozen ProcureHarness harness
        run: python scripts/validate_procureharness_harness_v01.py

      - name: Run offline ProcureHarness regressions
        run: python -m unittest discover -s scripts -p "test_procureharness*.py" -v

      - name: Refuse overwrite of frozen Phase 1 summary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e evidence/procureharness-phase1-search-summary-v0.1

      - name: Materialize Phase 1 search termination summary
        run: python scripts/materialize_procureharness_phase1_search_summary_v01.py

      - name: Audit materialized summary package
        run: |
          python -m unittest             scripts.test_procureharness_phase1_search_summary_v01 -v

      - name: Revalidate all ProcureHarness regressions
        run: python -m unittest discover -s scripts -p "test_procureharness*.py" -v

      - name: Print search termination summary
        run: |
          cat evidence/procureharness-phase1-search-summary-v0.1/README.md

      - name: Commit durable summary and retire one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add evidence/procureharness-phase1-search-summary-v0.1
          git rm .github/workflows/procureharness-phase1-summary-v0.1.yml

          git diff --cached --stat
          git commit -m "Freeze ProcureHarness Phase 1 search summary"
          git push origin "HEAD:codex/procureharness-phase1-summary-v0.1"
