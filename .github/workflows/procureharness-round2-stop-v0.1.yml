name: Freeze ProcureHarness Round 2 Plateau Stop v0.1

on:
  push:
    branches:
      - 'codex/procureharness-round2-stop-v0.1'
    paths:
      - '.github/workflows/procureharness-round2-stop-v0.1.yml'

permissions:
  contents: write

concurrency:
  group: procureharness-round2-stop-v0.1
  cancel-in-progress: false

jobs:
  stop-gate:
    name: Freeze Round 2 plateau stop
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate plateau-stop harness refreeze
        run: python scripts/validate_procureharness_harness_v01.py

      - name: Run offline ProcureHarness regressions
        run: python -m unittest discover -s scripts -p "test_procureharness*.py" -v

      - name: Refuse overwrite of frozen Round 2 progression
        shell: bash
        run: |
          set -euo pipefail
          test ! -e evidence/procureharness-search-gates-v0.1/round-progression-after-round-2.json
          for candidate in ph-r3-c13 ph-r3-c14 ph-r3-c15 ph-r3-c16 ph-r3-c17 ph-r3-c18
          do
            test ! -e "evidence/procureharness-search-gates-v0.1/$candidate--screening-auth.json"
          done

      - name: Preview frozen Round 2 stop decision
        run: |
          python scripts/select_procureharness_round_progression_v01.py             --completed-round 2             --preview

      - name: Freeze Round 2 plateau-stop artifact
        run: |
          python scripts/select_procureharness_round_progression_v01.py             --completed-round 2             --output-dir evidence/procureharness-search-gates-v0.1

      - name: Validate frozen stop and absence of Round 3 authorization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")
          from run_procureharness_search_v01 import round_candidate_ids
          from select_procureharness_round_progression_v01 import (
              validate_frozen_round2_progression,
          )

          gate = Path("evidence/procureharness-search-gates-v0.1")
          path = gate / "round-progression-after-round-2.json"
          payload = json.loads(path.read_text(encoding="utf-8"))
          validate_frozen_round2_progression(payload)

          assert payload["completed_round"] == 2
          assert payload["consecutive_no_new_frontier_rounds"] == 2
          assert payload["plateau_stop_threshold"] == 2
          assert payload["plateau_stop_fired"] is True
          assert payload["stop_search"] is True
          assert payload["decision"] == "stop"
          assert payload["next_round"] is None
          assert payload["screening_authorized_candidate_ids"] == []
          assert payload["round2_final_validation_candidate_ids"] == []
          assert payload["screened_unique_candidate_count"] == 12

          for candidate_id in round_candidate_ids(3):
              auth = gate / f"{candidate_id}--screening-auth.json"
              if auth.exists():
                  raise SystemExit(
                      f"Round-3 authorization must not exist: {auth}"
                  )

          print("validated two-round plateau stop; Round 3 is not authorized")
          PY

      - name: Run committed progression audit
        run: |
          python -m unittest             scripts.test_procureharness_round_progression_v01 -v

      - name: Print frozen stop decision
        run: |
          cat evidence/procureharness-search-gates-v0.1/round-progression-after-round-2.json

      - name: Commit plateau stop and retire one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add evidence/procureharness-search-gates-v0.1/round-progression-after-round-2.json
          git rm .github/workflows/procureharness-round2-stop-v0.1.yml

          git diff --cached --stat
          git commit -m "Freeze ProcureHarness Round 2 plateau stop"
          git push origin "HEAD:codex/procureharness-round2-stop-v0.1"
