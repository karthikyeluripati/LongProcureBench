name: Dispatch Held-out Paper Evaluation Once

on:
  push:
    branches:
      - run-heldout-paper-20260927
    paths:
      - ".github/workflows/dispatch-heldout-paper-once.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch frozen main workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/heldout-paper-evaluation-v0.1.yml/dispatches" \
            -f ref=main
