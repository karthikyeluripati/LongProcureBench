name: Checkpoint Fairness Audit

on:
  push:
    branches:
      - codex/checkpoint-fairness-audit-v0.1
    paths:
      - 'scripts/audit_checkpoint_fairness.py'
      - 'scripts/test_checkpoint_fairness.py'
      - '.github/workflows/checkpoint-fairness-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_RUN_ID: '36173979424'
      SOURCE_RUN_ATTEMPT: '1'
      RAW_DIR: raw-luna20
      OUTPUT_DIR: checkpoint-fairness-audit

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Run audit regression tests
        run: python -m unittest discover -s scripts -p "test_checkpoint_fairness.py" -v

      - name: Verify source workflow attempt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          conclusion="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/attempts/${SOURCE_RUN_ATTEMPT}" \
              --jq '.conclusion'
          )"
          if [ "$conclusion" != "success" ]; then
            echo "Source Luna diagnostic attempt was not successful: $conclusion"
            exit 1
          fi

      - name: Download immutable 60-run artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RAW_DIR"
          gh run download "$SOURCE_RUN_ID" \
            --name "luna20-diagnostic-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}" \
            --dir "$RAW_DIR"
          count="$(find "$RAW_DIR" -type f -name 'run-*.json' | wc -l | tr -d ' ')"
          if [ "$count" -ne 60 ]; then
            echo "Expected 60 raw run files; found $count"
            exit 1
          fi

      - name: Audit checkpoint fairness
        run: |
          python scripts/audit_checkpoint_fairness.py \
            --input-dir "$RAW_DIR" \
            --output-dir "$OUTPUT_DIR"

      - name: Show fairness report
        run: cat "$OUTPUT_DIR/checkpoint-fairness-report.md"

      - name: Upload fairness audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkpoint-fairness-audit-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 30
