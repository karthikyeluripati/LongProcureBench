name: Checkpoint Fairness Audit

on:
  push:
    branches:
      - main
      - codex/evaluator-v0.2
    paths:
      - 'scripts/audit_checkpoint_fairness.py'
      - 'scripts/audit_checkpoint_fairness_v02.py'
      - 'scripts/frozen_luna20_source.py'
      - 'scripts/test_checkpoint_fairness.py'
      - 'scripts/test_checkpoint_fairness_v02.py'
      - 'evidence/luna20-diagnostic-v0.1/fairness-source.b64.part*'
      - '.github/workflows/checkpoint-fairness-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OUTPUT_DIR: checkpoint-fairness-audit

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Run audit regression tests
        run: python -m unittest discover -s scripts -p "test_checkpoint_fairness.py" -v

      - name: Audit checkpoint fairness
        run: |
          python scripts/audit_checkpoint_fairness.py \
            --output-dir "$OUTPUT_DIR"

      - name: Show fairness report
        run: cat "$OUTPUT_DIR/checkpoint-fairness-report.md"

      - name: Upload fairness audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkpoint-fairness-audit-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 30
