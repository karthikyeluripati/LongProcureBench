name: ProcureHarness Round 2 Development Confirmation v0.1

on:
  push:
    branches:
      - 'codex/procureharness-round2-confirmation-v0.1'
    paths:
      - '.github/workflows/procureharness-round2-confirmation-v0.1.yml'
  # One-time paid execution. No workflow_dispatch.

permissions:
  contents: write
  actions: write

concurrency:
  group: procureharness-round2-confirmation-v0.1
  cancel-in-progress: false

jobs:
  preflight:
    name: Frozen Round 2 confirmation preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Refuse execution after Round 2 confirmation is frozen
        shell: bash
        run: |
          set -euo pipefail
          selection="evidence/procureharness-search-gates-v0.1/validation-selection-round-2.json"
          manifest="evidence/procureharness-round2-confirmation-v0.1/manifest.json"
          if [ -e "$selection" ] || [ -e "$manifest" ]; then
            echo "Round 2 confirmation is already frozen; refusing paid rerun."
            exit 1
          fi

      - name: Validate immutable ProcureHarness implementation freeze
        run: python scripts/validate_procureharness_harness_v01.py

      - name: Run ProcureHarness offline regressions
        run: python -m unittest discover -s scripts -p "test_procureharness*.py" -v

      - name: Validate exact C12 and C09 confirmation authorizations and plans
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/procureharness-r2-confirmation-plans
          for candidate in ph-r2-c12 ph-r2-c09
          do
            auth="evidence/procureharness-search-gates-v0.1/$candidate--development-confirmation-auth.json"
            test -f "$auth"
            python scripts/run_procureharness_search_v01.py               --candidate "$candidate"               --phase development_confirmation               --authorization-json "$auth"               --plan-output "/tmp/procureharness-r2-confirmation-plans/$candidate.json"               >/dev/null
          done

          python - <<'PY'
          import json
          from pathlib import Path

          candidates = ["ph-r2-c12", "ph-r2-c09"]
          expected_suffixes = list(range(1, 21)) * 3
          expected_repeats = [1] * 20 + [2] * 20 + [3] * 20

          for candidate in candidates:
              payload = json.loads(
                  (
                      Path("/tmp/procureharness-r2-confirmation-plans")
                      / f"{candidate}.json"
                  ).read_text(encoding="utf-8")
              )
              if payload["run_count"] != 60:
                  raise SystemExit(f"{candidate}: expected 60 runs")
              if (
                  payload["round"] != 2
                  or payload["phase"] != "development_confirmation"
              ):
                  raise SystemExit(f"{candidate}: wrong round/phase")
              if payload["model"] != "openai/gpt-5.6-sol":
                  raise SystemExit(f"{candidate}: model drift")
              if payload["reasoning_effort"] != "medium":
                  raise SystemExit(f"{candidate}: reasoning drift")
              if payload["temperature"] is not None:
                  raise SystemExit(f"{candidate}: temperature drift")
              suffixes = [
                  int(row["episode_id"].rsplit("-", 1)[1])
                  for row in payload["runs"]
              ]
              repeats = [row["repeat"] for row in payload["runs"]]
              if suffixes != expected_suffixes or repeats != expected_repeats:
                  raise SystemExit(f"{candidate}: confirmation grid drift")
          print("validated C12/C09 on frozen 001-020 x3 grid")
          PY

      - name: Require OpenAI credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" ||             (echo "OPENAI_API_KEY is missing" && exit 1)

      - name: Disable one-time workflow before paid execution
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow_id="$(
            gh api               "repos/${{ github.repository }}/actions/workflows/procureharness-round2-confirmation-v0.1.yml"               --jq '.id'
          )"
          gh api --method PUT             "repos/${{ github.repository }}/actions/workflows/$workflow_id/disable"
          state="$(
            gh api               "repos/${{ github.repository }}/actions/workflows/$workflow_id"               --jq '.state'
          )"
          echo "workflow id=$workflow_id state=$state"
          test "$state" = "disabled_manually"

  confirmation:
    name: Confirm ${{ matrix.candidate }} on 001-020 x3
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        candidate:
          - ph-r2-c12
          - ph-r2-c09
    env:
      CANDIDATE: ${{ matrix.candidate }}
      OUTPUT_DIR: results/procureharness-architecture-search-v0.1

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Execute authorized Round 2 development confirmation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          auth="evidence/procureharness-search-gates-v0.1/$CANDIDATE--development-confirmation-auth.json"
          python -u scripts/run_procureharness_search_v01.py             --candidate "$CANDIDATE"             --phase development_confirmation             --authorization-json "$auth"             --execute             --output-dir "$OUTPUT_DIR"

      - name: Validate exact candidate confirmation evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")
          from run_procureharness_search_v01 import (
              DEVELOPMENT_EPISODES,
              MODEL,
              validate_phase_authorization,
          )

          candidate = os.environ["CANDIDATE"]
          output = Path(os.environ["OUTPUT_DIR"])
          root = output / candidate / "development_confirmation"
          summary_path = root / "summary.json"
          if not summary_path.is_file():
              raise SystemExit(f"missing summary: {summary_path}")

          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          if summary.get("candidate_id") != candidate:
              raise SystemExit("candidate mismatch")
          if (
              summary.get("round") != 2
              or summary.get("phase") != "development_confirmation"
          ):
              raise SystemExit("round/phase mismatch")
          if summary.get("model") != MODEL:
              raise SystemExit("model drift")
          if summary.get("reasoning_effort") != "medium":
              raise SystemExit("reasoning drift")
          if summary.get("temperature") is not None:
              raise SystemExit("temperature drift")
          if summary.get("planned_runs") != 60:
              raise SystemExit("planned_runs must equal 60")
          if summary.get("completed_runs") != 60:
              raise SystemExit("confirmation must complete 60 runs")
          if summary.get("execution_failures") != 0:
              raise SystemExit("confirmation contains execution failures")

          auth_path = Path(
              "evidence/procureharness-search-gates-v0.1"
          ) / f"{candidate}--development-confirmation-auth.json"
          authorization = json.loads(auth_path.read_text(encoding="utf-8"))
          validate_phase_authorization(
              candidate_id=candidate,
              phase="development_confirmation",
              authorization=authorization,
          )
          if summary.get("authorization") != authorization:
              raise SystemExit("summary authorization drift")

          expected_names = sorted(
              f"{episode_id}.json"
              for episode_id in DEVELOPMENT_EPISODES
          )
          expected_rows = [
              (episode_id, repeat)
              for repeat in (1, 2, 3)
              for episode_id in DEVELOPMENT_EPISODES
          ]
          rows = summary.get("rows")
          if [
              (row.get("episode_id"), row.get("repeat"))
              for row in rows
          ] != expected_rows:
              raise SystemExit("summary grid drift")

          for repeat in (1, 2, 3):
              names = sorted(
                  path.name
                  for path in (root / f"r{repeat}").glob("*.json")
              )
              if names != expected_names:
                  raise SystemExit(
                      f"{candidate}: repeat {repeat} raw grid drift"
                  )
          print(f"validated {candidate}: exact 60-run confirmation evidence")
          PY

      - name: Stage candidate evidence
        if: always()
        shell: bash
        run: |
          rm -rf artifact
          mkdir -p artifact
          if [ -d "$OUTPUT_DIR/$CANDIDATE" ]; then
            cp -a "$OUTPUT_DIR/$CANDIDATE" "artifact/$CANDIDATE"
          fi

      - name: Upload candidate confirmation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: procureharness-r2-confirmation-${{ matrix.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact
          if-no-files-found: error
          retention-days: 30

  freeze-selection:
    name: Freeze Round 2 validation-entry selection
    needs: confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EVIDENCE_ROOT: evidence/procureharness-round2-confirmation-v0.1
      GATE_ROOT: evidence/procureharness-search-gates-v0.1

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Download both Round 2 confirmation artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: procureharness-r2-confirmation-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}/results
          merge-multiple: true

      - name: Revalidate frozen harness before validation-entry selection
        run: python scripts/validate_procureharness_harness_v01.py

      - name: Freeze deterministic Round 2 validation-entry selection
        shell: bash
        run: |
          set -euo pipefail
          python scripts/select_procureharness_validation_v01.py             --round 2             --results-root "$EVIDENCE_ROOT/results"             --screening-selection-json "$GATE_ROOT/screening-selection-round-2.json"             --output-dir "$GATE_ROOT"

      - name: Revalidate selection and any quality validation authorizations
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")
          from run_procureharness_search_v01 import (
              validate_phase_authorization,
          )
          from select_procureharness_validation_v01 import (
              validate_frozen_validation_selection,
          )

          gate = Path(os.environ["GATE_ROOT"])
          path = gate / "validation-selection-round-2.json"
          selection = json.loads(path.read_text(encoding="utf-8"))
          validate_frozen_validation_selection(selection)

          if selection["screening_selected_candidate_ids"] != [
              "ph-r2-c12",
              "ph-r2-c09",
          ]:
              raise SystemExit("Round-2 confirmation candidate set drift")

          for candidate_id in selection[
              "validation_selected_candidate_ids"
          ]:
              auth = json.loads(
                  (
                      gate / f"{candidate_id}--validation-auth.json"
                  ).read_text(encoding="utf-8")
              )
              validate_phase_authorization(
                  candidate_id=candidate_id,
                  phase="validation",
                  authorization=auth,
              )

          print(
              "quality-selected:",
              selection["validation_selected_candidate_ids"],
          )
          print(
              "pending-efficiency:",
              selection["pending_efficiency_candidate_ids"],
          )
          PY

      - name: Write durable Round 2 confirmation manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_ROOT"])
          gate = Path(os.environ["GATE_ROOT"])
          selection = json.loads(
              (gate / "validation-selection-round-2.json")
              .read_text(encoding="utf-8")
          )

          def binding(path):
              raw = path.read_bytes()
              return {
                  "path": str(path),
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "bytes": len(raw),
              }

          source_files = [
              binding(path)
              for path in sorted(root.rglob("*.json"))
              if path.name != "manifest.json"
          ]
          input_authorization_files = [
              binding(
                  gate / (
                      f"{candidate_id}"
                      "--development-confirmation-auth.json"
                  )
              )
              for candidate_id in ("ph-r2-c12", "ph-r2-c09")
          ]
          gate_paths = [
              gate / "validation-selection-round-2.json",
              *[
                  gate / f"{candidate_id}--validation-auth.json"
                  for candidate_id in selection[
                      "validation_selected_candidate_ids"
                  ]
              ],
          ]
          gate_files = [binding(path) for path in gate_paths]

          manifest = {
              "schema_version": "0.1.0",
              "protocol_id": "procureharness-architecture-search-v0.1",
              "package_id": "procureharness-round2-confirmation-v0.1",
              "round": 2,
              "phase": "development_confirmation",
              "candidate_ids": ["ph-r2-c12", "ph-r2-c09"],
              "episode_suffixes": list(range(1, 21)),
              "repeats": 3,
              "total_runs": 120,
              "model": "openai/gpt-5.6-sol",
              "reasoning_effort": "medium",
              "temperature": None,
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "workflow_commit_sha": os.environ["GITHUB_SHA"],
              "source_files": source_files,
              "input_authorization_files": input_authorization_files,
              "gate_files": gate_files,
              "validation_selected_candidate_ids": selection[
                  "validation_selected_candidate_ids"
              ],
              "pending_efficiency_candidate_ids": selection[
                  "pending_efficiency_candidate_ids"
              ],
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run durable Round 2 confirmation evidence audit
        run: |
          python -m unittest             scripts.test_procureharness_round2_confirmation_evidence_v01 -v

      - name: Print frozen Round 2 validation-entry selection
        run: cat "$GATE_ROOT/validation-selection-round-2.json"

      - name: Commit confirmation evidence and retire one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f "$EVIDENCE_ROOT"
          git add "$GATE_ROOT/validation-selection-round-2.json"

          python - <<'PY' > /tmp/r2-quality-selected.txt
          import json
          from pathlib import Path
          selection = json.loads(
              Path(
                  "evidence/procureharness-search-gates-v0.1/"
                  "validation-selection-round-2.json"
              ).read_text(encoding="utf-8")
          )
          for candidate_id in selection[
              "validation_selected_candidate_ids"
          ]:
              print(candidate_id)
          PY

          while read -r candidate_id; do
            [ -n "$candidate_id" ] || continue
            git add "$GATE_ROOT/$candidate_id--validation-auth.json"
          done < /tmp/r2-quality-selected.txt

          git rm             .github/workflows/procureharness-round2-confirmation-v0.1.yml

          git diff --cached --stat
          git commit -m "Freeze ProcureHarness Round 2 confirmation evidence"
          git push origin "HEAD:codex/procureharness-round2-confirmation-v0.1"

      - name: Upload complete Round 2 confirmation package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: procureharness-round2-confirmation-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.EVIDENCE_ROOT }}
            ${{ env.GATE_ROOT }}/validation-selection-round-2.json
            ${{ env.GATE_ROOT }}/*--validation-auth.json
          if-no-files-found: warn
          retention-days: 30
