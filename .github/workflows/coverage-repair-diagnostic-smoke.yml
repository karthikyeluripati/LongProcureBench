name: Coverage-Repair Diagnostic Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OUTPUT_DIR: results/coverage-repair-smoke-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Run coverage-repair regressions
        run: python -m unittest discover -s scripts -p "test_coverage_repair_context.py" -v

      - name: Run three-episode live diagnostic smoke
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY is missing" && exit 1)
          python scripts/run_coverage_repair_pilot.py \
            --model openai/gpt-5.6-sol \
            --episode electrical-bongabon-generator-001 \
            --episode electrical-dla-power-supply-016 \
            --episode electrical-vre-generator-020 \
            --repeats 1 \
            --max-actions 20 \
            --omit-temperature \
            --reasoning-effort medium \
            --output-dir "$OUTPUT_DIR"

      - name: Validate execution and evaluation
        run: python scripts/validate_live_pilot_statuses.py "$OUTPUT_DIR/runs.csv"

      - name: Validate smoke activation
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["OUTPUT_DIR"]) / "coverage-repair-diagnostics.json"
          payload = json.loads(path.read_text(encoding="utf-8"))
          interventions = payload["totals"]["coverage_repair_interventions"]
          if interventions < 1:
              raise SystemExit("coverage-repair controller never activated")
          print(json.dumps(payload["totals"], indent=2, sort_keys=True))
          PY

      - name: Print smoke summary
        if: always()
        shell: bash
        run: |
          if [ -f "$OUTPUT_DIR/summary.json" ]; then
            cat "$OUTPUT_DIR/summary.json"
          fi
          if [ -f "$OUTPUT_DIR/coverage-repair-diagnostics.json" ]; then
            cat "$OUTPUT_DIR/coverage-repair-diagnostics.json"
          fi

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-repair-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 30
