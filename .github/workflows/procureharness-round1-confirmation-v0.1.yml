name: ProcureHarness Round 1 Development Confirmation v0.1

on:
  push:
    branches:
      - 'codex/procureharness-round1-confirmation-v0.1'
    paths:
      - '.github/workflows/procureharness-round1-confirmation-v0.1.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: procureharness-round1-confirmation-v0.1
  cancel-in-progress: false

jobs:
  preflight:
    name: Frozen confirmation preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Refuse execution after confirmation is frozen
        shell: bash
        run: |
          set -euo pipefail
          manifest="evidence/procureharness-round1-confirmation-v0.1/manifest.json"
          selection="evidence/procureharness-search-gates-v0.1/validation-selection-round-1.json"
          if [ -e "$manifest" ] || [ -e "$selection" ]; then
            echo "Round 1 development confirmation is already frozen; refusing paid rerun."
            exit 1
          fi

      - name: Validate immutable ProcureHarness implementation freeze
        run: python scripts/validate_procureharness_harness_v01.py

      - name: Revalidate frozen screening selection and authorizations
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")
          from run_procureharness_search_v01 import validate_phase_authorization
          from select_procureharness_screening_v01 import validate_frozen_screening_selection

          gate = Path("evidence/procureharness-search-gates-v0.1")
          selection = json.loads(
              (gate / "screening-selection-round-1.json").read_text(encoding="utf-8")
          )
          validate_frozen_screening_selection(selection)
          if selection.get("selected_candidate_ids") != ["ph-r1-c02", "ph-r1-c05"]:
              raise SystemExit(
                  f"unexpected frozen Round 1 selection: {selection.get('selected_candidate_ids')}"
              )

          for candidate_id in ("ph-r1-c02", "ph-r1-c05"):
              auth = json.loads(
                  (gate / f"{candidate_id}--development-confirmation-auth.json")
                  .read_text(encoding="utf-8")
              )
              validate_phase_authorization(
                  candidate_id=candidate_id,
                  phase="development_confirmation",
                  authorization=auth,
              )

          print("validated frozen C02+C05 development-confirmation authorization")
          PY

      - name: Run ProcureHarness offline regressions
        run: python -m unittest discover -s scripts -p "test_procureharness*.py" -v

      - name: Validate exact confirmation plans
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/procureharness-confirmation-plans
          for candidate in ph-r1-c02 ph-r1-c05
          do
            python scripts/run_procureharness_search_v01.py               --candidate "$candidate"               --phase development_confirmation               --authorization-json                 "evidence/procureharness-search-gates-v0.1/$candidate--development-confirmation-auth.json"               --plan-output "/tmp/procureharness-confirmation-plans/$candidate.json"               >/dev/null
          done

          python - <<'PY'
          import json
          from pathlib import Path

          for candidate in ("ph-r1-c02", "ph-r1-c05"):
              payload = json.loads(
                  (Path("/tmp/procureharness-confirmation-plans") / f"{candidate}.json")
                  .read_text(encoding="utf-8")
              )
              if payload.get("run_count") != 60:
                  raise SystemExit(f"{candidate}: expected 60 confirmation runs")
              if payload.get("round") != 1:
                  raise SystemExit(f"{candidate}: wrong round")
              if payload.get("phase") != "development_confirmation":
                  raise SystemExit(f"{candidate}: wrong phase")
              if payload.get("model") != "openai/gpt-5.6-sol":
                  raise SystemExit(f"{candidate}: wrong model")
              if payload.get("reasoning_effort") != "medium":
                  raise SystemExit(f"{candidate}: wrong reasoning effort")
              if payload.get("temperature") is not None:
                  raise SystemExit(f"{candidate}: temperature must be omitted")

              expected = [
                  (episode, repeat)
                  for repeat in (1, 2, 3)
                  for episode in [
                      f"electrical-bongabon-generator-001",
                      f"electrical-national-museum-lighting-002",
                      f"electrical-neust-cable-003",
                      f"electrical-dla-breaker-004",
                      f"electrical-barrie-transformer-005",
                      f"electrical-bfar-generator-006",
                      f"electrical-negros-wire-007",
                      f"electrical-burauen-generator-008",
                      f"electrical-highpoint-transformer-009",
                      f"electrical-painesville-switchgear-010",
                      f"electrical-sagada-generator-011",
                      f"electrical-dla-relay-012",
                      f"electrical-dla-transformer-013",
                      f"electrical-dla-battery-supply-014",
                      f"electrical-dla-battery-charger-015",
                      f"electrical-dla-power-supply-016",
                      f"electrical-dla-qpl-breaker-017",
                      f"electrical-highpoint-cable-018",
                      f"electrical-usaf-ups-019",
                      f"electrical-vre-generator-020",
                  ]
              ]
              observed = [
                  (row["episode_id"], row["repeat"])
                  for row in payload["runs"]
              ]
              if observed != expected:
                  raise SystemExit(f"{candidate}: confirmation grid drift")
          print("validated C02+C05 × episodes 001-020 × repeats 1,2,3")
          PY

      - name: Require OpenAI credential before paid execution
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY is missing" && exit 1)

  confirmation:
    name: Confirm ${{ matrix.candidate }} on 001-020 x3
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        candidate:
          - ph-r1-c02
          - ph-r1-c05
    env:
      CANDIDATE: ${{ matrix.candidate }}
      OUTPUT_DIR: results/procureharness-architecture-search-v0.1

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Execute frozen development confirmation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY is missing" && exit 1)

          python -u scripts/run_procureharness_search_v01.py             --candidate "$CANDIDATE"             --phase development_confirmation             --authorization-json               "evidence/procureharness-search-gates-v0.1/$CANDIDATE--development-confirmation-auth.json"             --execute             --output-dir "$OUTPUT_DIR"

      - name: Validate exact 60-run candidate evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")
          from run_procureharness_search_v01 import DEVELOPMENT_EPISODES

          candidate = os.environ["CANDIDATE"]
          root = (
              Path(os.environ["OUTPUT_DIR"])
              / candidate
              / "development_confirmation"
          )
          summary_path = root / "summary.json"
          if not summary_path.is_file():
              raise SystemExit(f"missing confirmation summary: {summary_path}")

          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          required = {
              "candidate_id": candidate,
              "round": 1,
              "phase": "development_confirmation",
              "model": "openai/gpt-5.6-sol",
              "reasoning_effort": "medium",
              "temperature": None,
              "planned_runs": 60,
              "completed_runs": 60,
              "execution_failures": 0,
          }
          for key, value in required.items():
              if summary.get(key) != value:
                  raise SystemExit(
                      f"{candidate}: {key} mismatch: {summary.get(key)!r} != {value!r}"
                  )

          rows = summary.get("rows")
          if not isinstance(rows, list) or len(rows) != 60:
              raise SystemExit(f"{candidate}: expected exactly 60 summary rows")

          expected = [
              (episode_id, repeat)
              for repeat in (1, 2, 3)
              for episode_id in DEVELOPMENT_EPISODES
          ]
          observed = [
              (row.get("episode_id"), row.get("repeat"))
              for row in rows
          ]
          if observed != expected:
              raise SystemExit(f"{candidate}: confirmation summary grid drift")

          raw_files = []
          for repeat in (1, 2, 3):
              repeat_files = sorted((root / f"r{repeat}").glob("*.json"))
              if len(repeat_files) != 20:
                  raise SystemExit(
                      f"{candidate}: repeat {repeat} has {len(repeat_files)} files"
                  )
              raw_files.extend(repeat_files)
          if len(raw_files) != 60:
              raise SystemExit(f"{candidate}: expected 60 raw run files")

          print(f"validated {candidate}: exact clean 60-run confirmation evidence")
          PY

      - name: Stage candidate confirmation evidence
        if: always()
        shell: bash
        run: |
          rm -rf artifact
          mkdir -p artifact
          if [ -d "$OUTPUT_DIR/$CANDIDATE" ]; then
            cp -a "$OUTPUT_DIR/$CANDIDATE" "artifact/$CANDIDATE"
          fi

      - name: Upload candidate confirmation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: procureharness-r1-confirmation-${{ matrix.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact
          if-no-files-found: error
          retention-days: 30

  freeze-and-materialize:
    name: Freeze validation entry and materialize evidence
    needs: confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EVIDENCE_ROOT: evidence/procureharness-round1-confirmation-v0.1
      GATE_ROOT: evidence/procureharness-search-gates-v0.1

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Download C02 and C05 confirmation artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: procureharness-r1-confirmation-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}/results
          merge-multiple: true

      - name: Revalidate frozen implementation and source screening gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_procureharness_harness_v01.py
          python - <<'PY'
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")
          from select_procureharness_screening_v01 import validate_frozen_screening_selection
          from run_procureharness_search_v01 import validate_phase_authorization

          gate = Path("evidence/procureharness-search-gates-v0.1")
          screening = json.loads(
              (gate / "screening-selection-round-1.json").read_text(encoding="utf-8")
          )
          validate_frozen_screening_selection(screening)
          if screening.get("selected_candidate_ids") != ["ph-r1-c02", "ph-r1-c05"]:
              raise SystemExit("screening selection changed")

          for candidate in ("ph-r1-c02", "ph-r1-c05"):
              auth = json.loads(
                  (gate / f"{candidate}--development-confirmation-auth.json")
                  .read_text(encoding="utf-8")
              )
              validate_phase_authorization(
                  candidate_id=candidate,
                  phase="development_confirmation",
                  authorization=auth,
              )
          PY

      - name: Freeze Round 1 validation-entry selection
        shell: bash
        run: |
          set -euo pipefail
          python scripts/select_procureharness_validation_v01.py             --round 1             --results-root "$EVIDENCE_ROOT/results"             --screening-selection-json               "$GATE_ROOT/screening-selection-round-1.json"             --output-dir "$GATE_ROOT"
          rm -f "$GATE_ROOT/.validation-selection-round-1.lock"

      - name: Revalidate frozen validation selection and any quality authorizations
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")
          from select_procureharness_validation_v01 import (
              validate_frozen_validation_selection,
          )
          from run_procureharness_search_v01 import validate_phase_authorization

          gate = Path("evidence/procureharness-search-gates-v0.1")
          selection_path = gate / "validation-selection-round-1.json"
          selection = json.loads(selection_path.read_text(encoding="utf-8"))
          validate_frozen_validation_selection(selection)

          allowed = {"ph-r1-c02", "ph-r1-c05"}
          selected = selection.get("validation_selected_candidate_ids") or []
          pending = selection.get("pending_efficiency_candidate_ids") or []
          slots = selection.get("validation_slot_candidate_ids") or []

          if not set(selected).issubset(allowed):
              raise SystemExit(f"unexpected quality-selected candidate(s): {selected}")
          if not set(pending).issubset(allowed):
              raise SystemExit(f"unexpected pending-efficiency candidate(s): {pending}")
          if not set(slots).issubset(allowed):
              raise SystemExit(f"unexpected validation slot candidate(s): {slots}")
          if len(slots) > 2:
              raise SystemExit("validation slot cap exceeded")

          for candidate in selected:
              auth_path = gate / f"{candidate}--validation-auth.json"
              if not auth_path.is_file():
                  raise SystemExit(f"missing quality validation auth: {auth_path}")
              auth = json.loads(auth_path.read_text(encoding="utf-8"))
              validate_phase_authorization(
                  candidate_id=candidate,
                  phase="validation",
                  authorization=auth,
              )

          print("quality-selected:", selected)
          print("pending-efficiency:", pending)
          print("reserved validation slots:", slots)
          PY

      - name: Write durable confirmation evidence manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_ROOT"])
          gate = Path(os.environ["GATE_ROOT"])

          source_files = []
          for path in sorted(root.rglob("*.json")):
              if path.name == "manifest.json":
                  continue
              raw = path.read_bytes()
              source_files.append({
                  "path": str(path),
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "bytes": len(raw),
              })

          if len(source_files) != 122:
              raise SystemExit(
                  f"expected 122 confirmation JSON files, got {len(source_files)}"
              )

          gate_paths = [gate / "validation-selection-round-1.json"]
          gate_paths.extend(sorted(gate.glob("ph-r1-c*--validation-auth.json")))
          gate_files = []
          for path in gate_paths:
              raw = path.read_bytes()
              gate_files.append({
                  "path": str(path),
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "bytes": len(raw),
              })

          selection = json.loads(
              (gate / "validation-selection-round-1.json").read_text(encoding="utf-8")
          )

          manifest = {
              "schema_version": "0.1.0",
              "protocol_id": "procureharness-architecture-search-v0.1",
              "package_id": "procureharness-round1-confirmation-v0.1",
              "round": 1,
              "phase": "development_confirmation",
              "candidate_ids": ["ph-r1-c02", "ph-r1-c05"],
              "episode_suffixes": list(range(1, 21)),
              "repeats": 3,
              "total_runs": 120,
              "model": "openai/gpt-5.6-sol",
              "reasoning_effort": "medium",
              "temperature": None,
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "workflow_commit_sha": os.environ["GITHUB_SHA"],
              "validation_selected_candidate_ids": (
                  selection.get("validation_selected_candidate_ids") or []
              ),
              "pending_efficiency_candidate_ids": (
                  selection.get("pending_efficiency_candidate_ids") or []
              ),
              "validation_slot_candidate_ids": (
                  selection.get("validation_slot_candidate_ids") or []
              ),
              "source_files": source_files,
              "gate_files": gate_files,
          }

          (root / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(
              f"manifested {len(source_files)} confirmation files and "
              f"{len(gate_files)} new validation gate files"
          )
          PY

      - name: Verify manifest bindings before commit
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("evidence/procureharness-round1-confirmation-v0.1/manifest.json")
              .read_text(encoding="utf-8")
          )
          if manifest.get("total_runs") != 120:
              raise SystemExit("confirmation manifest total_runs mismatch")
          if manifest.get("candidate_ids") != ["ph-r1-c02", "ph-r1-c05"]:
              raise SystemExit("confirmation manifest candidate set changed")
          if len(manifest.get("source_files", [])) != 122:
              raise SystemExit("confirmation source-file count changed")

          for item in [*manifest["source_files"], *manifest["gate_files"]]:
              path = Path(item["path"])
              raw = path.read_bytes()
              if hashlib.sha256(raw).hexdigest() != item["sha256"]:
                  raise SystemExit(f"manifest SHA mismatch: {path}")
              if len(raw) != item["bytes"]:
                  raise SystemExit(f"manifest byte-count mismatch: {path}")

          print("verified all confirmation manifest bindings")
          PY

      - name: Print frozen development-confirmation outcome
        run: cat "$GATE_ROOT/validation-selection-round-1.json"

      - name: Commit durable evidence and retire one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f "$EVIDENCE_ROOT"
          git add "$GATE_ROOT/validation-selection-round-1.json"

          shopt -s nullglob
          validation_auths=("$GATE_ROOT"/ph-r1-c*--validation-auth.json)
          if [ ${#validation_auths[@]} -gt 0 ]; then
            git add "${validation_auths[@]}"
          fi

          git rm .github/workflows/procureharness-round1-confirmation-v0.1.yml
          git diff --cached --stat
          git commit -m "Freeze ProcureHarness Round 1 confirmation evidence"
          git push origin "HEAD:codex/procureharness-round1-confirmation-v0.1"

      - name: Upload durable confirmation package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: procureharness-round1-confirmation-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.EVIDENCE_ROOT }}
            ${{ env.GATE_ROOT }}/validation-selection-round-1.json
            ${{ env.GATE_ROOT }}/*--validation-auth.json
          if-no-files-found: warn
          retention-days: 30
