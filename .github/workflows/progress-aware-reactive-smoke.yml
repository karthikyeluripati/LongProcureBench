name: Progress-Aware Reactive Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - run-progress-aware-smoke-20260927
    paths:
      - ".github/workflows/progress-aware-reactive-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OUTPUT_DIR: results/progress-aware-smoke-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Run progress-aware regressions
        run: |
          python -m unittest discover -s scripts -p "test_progress_aware_reactive.py" -v
          python -m unittest discover -s scripts -p "test_context_compiled_reactive.py" -v
          python -m unittest discover -s scripts -p "test_reactive_pilot.py" -v
      - name: Run one live progress-aware episode
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY is missing" && exit 1)
          python -u scripts/run_progress_aware_pilot.py \
            --model openai/gpt-5.6-sol \
            --episode electrical-painesville-switchgear-010 \
            --repeats 1 \
            --max-actions 15 \
            --omit-temperature \
            --reasoning-effort medium \
            --output-dir "$OUTPUT_DIR"
      - name: Validate execution and evaluation
        run: python scripts/validate_live_pilot_statuses.py "$OUTPUT_DIR/runs.csv"
      - name: Print smoke summary
        if: always()
        run: |
          if [ -f "$OUTPUT_DIR/summary.json" ]; then cat "$OUTPUT_DIR/summary.json"; fi
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: progress-aware-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 30
