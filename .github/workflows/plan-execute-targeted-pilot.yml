name: Plan-and-Execute Targeted Pilot

on:
  push:
    branches:
      - codex/plan-execute-targeted-pilot-run

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUTPUT_DIR: results/plan-execute-targeted-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Plan-and-Execute regressions
        run: python -m unittest discover -s scripts -p "test_plan_execute_comparator.py" -v

      - name: Run frozen three-episode mechanism pilot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY is missing" && exit 1)
          python -u scripts/run_plan_execute_comparator.py             --model openai/gpt-5.6-sol             --output-dir "$OUTPUT_DIR"

      - name: Validate exact pilot protocol
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["OUTPUT_DIR"])
          runs_csv = root / "runs.csv"
          if not runs_csv.is_file():
              raise SystemExit("runs.csv missing")

          rows = list(csv.DictReader(
              runs_csv.open(newline="", encoding="utf-8")
          ))
          expected = {
              "electrical-burauen-generator-008",
              "electrical-dla-transformer-013",
              "electrical-dla-power-supply-016",
          }
          actual = {row["episode_id"] for row in rows}
          if len(rows) != 3 or actual != expected:
              raise SystemExit(
                  f"expected exact 008/013/016 x1 grid; rows={len(rows)} episodes={sorted(actual)}"
              )

          run_files = sorted(root.rglob("run-*.json"))
          if len(run_files) != 3:
              raise SystemExit(f"expected exactly 3 run JSONs, got {len(run_files)}")

          diagnostics = []
          for path in run_files:
              payload = json.loads(path.read_text(encoding="utf-8"))
              metrics = payload.get("policy_metrics") or {}
              diagnostics.append({
                  "episode_id": payload.get("episode_id"),
                  "status": payload.get("status"),
                  "model": metrics.get("model"),
                  "temperature": metrics.get("temperature"),
                  "reasoning_effort": metrics.get("reasoning_effort"),
                  "planner_calls": metrics.get("planner_calls"),
                  "executor_calls": metrics.get("executor_calls"),
                  "model_calls": metrics.get("model_calls_attempted"),
                  "total_tokens": metrics.get("total_tokens"),
                  "cost_usd": metrics.get("cost_usd"),
                  "unplanned_exceptions": metrics.get("unplanned_exceptions"),
                  "plan_step_usage": metrics.get("plan_step_usage"),
              })
              if metrics.get("temperature") is not None:
                  raise SystemExit(
                      f"temperature must be omitted: {payload.get('episode_id')}"
                  )
              if metrics.get("reasoning_effort") != "medium":
                  raise SystemExit(
                      f"reasoning effort drift: {payload.get('episode_id')}={metrics.get('reasoning_effort')}"
                  )
              if metrics.get("planner_calls") != 1:
                  raise SystemExit(
                      f"expected exactly one planner call: {payload.get('episode_id')}"
                  )

          print(json.dumps(diagnostics, indent=2, sort_keys=True))
          PY

      - name: Validate clean completion
        run: python scripts/validate_live_pilot_statuses.py "$OUTPUT_DIR/runs.csv"

      - name: Print pilot evidence
        if: always()
        shell: bash
        run: |
          if [ -f "$OUTPUT_DIR/summary.json" ]; then
            cat "$OUTPUT_DIR/summary.json"
          fi
          if [ -f "$OUTPUT_DIR/plan-execute-diagnostics.json" ]; then
            cat "$OUTPUT_DIR/plan-execute-diagnostics.json"
          fi

      - name: Upload targeted pilot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plan-execute-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 30
