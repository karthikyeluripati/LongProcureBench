name: Checkpoint Fairness Audit v0.2

on:
  push:
    branches:
      - main
      - codex/checkpoint-fairness-audit-v0.1
    paths:
      - 'scripts/audit_checkpoint_fairness.py'
      - 'scripts/audit_checkpoint_fairness_v02.py'
      - 'scripts/frozen_luna20_source.py'
      - 'scripts/test_checkpoint_fairness*.py'
      - '.github/workflows/checkpoint-fairness-audit-v02.yml'
      - 'evidence/luna20-diagnostic-v0.1/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run fairness regressions
        run: python -m unittest discover -s scripts -p "test_checkpoint_fairness*.py" -v
      - name: Verify durable source
        run: python -c "import pathlib,sys; sys.path.insert(0, 'scripts'); from frozen_luna20_source import load_frozen_luna20_source; assert len(load_frozen_luna20_source(pathlib.Path('.'))) == 60"
      - name: Run fairness audit
        run: python scripts/audit_checkpoint_fairness.py --output-dir checkpoint-fairness-audit
      - name: Upload fairness audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkpoint-fairness-audit
          path: checkpoint-fairness-audit
          if-no-files-found: error
          retention-days: 30
