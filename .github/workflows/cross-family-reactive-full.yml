name: Cross-Family Reactive Full Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openai:
    name: OpenAI reactive 20x3
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OUTPUT_DIR: results/cross-family-reactive-v0.1/openai-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Run OpenAI development-suite baseline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY is missing" && exit 1)
          python scripts/run_reactive_pilot.py             --model openai/gpt-5.6-sol             --development-suite             --repeats 3             --max-actions 50             --omit-temperature             --reasoning-effort medium             --output-dir "$OUTPUT_DIR"
      - name: Validate run statuses
        run: python scripts/validate_live_pilot_statuses.py "$OUTPUT_DIR/runs.csv"
      - name: Upload OpenAI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cross-family-openai-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  anthropic:
    name: Anthropic reactive 20x3
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OUTPUT_DIR: results/cross-family-reactive-v0.1/anthropic-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Anthropic development-suite baseline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || (echo "ANTHROPIC_API_KEY is missing" && exit 1)
          python scripts/run_reactive_pilot.py             --model anthropic/claude-opus-5-5             --development-suite             --repeats 3             --max-actions 50             --omit-temperature             --output-dir "$OUTPUT_DIR"
      - name: Validate run statuses
        run: python scripts/validate_live_pilot_statuses.py "$OUTPUT_DIR/runs.csv"
      - name: Upload Anthropic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cross-family-anthropic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  gemini:
    name: Gemini reactive 20x3
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OUTPUT_DIR: results/cross-family-reactive-v0.1/gemini-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Gemini development-suite baseline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || (echo "GEMINI_API_KEY is missing" && exit 1)
          python scripts/run_reactive_pilot.py             --model gemini/gemini-3.8-flash             --development-suite             --repeats 3             --max-actions 50             --omit-temperature             --output-dir "$OUTPUT_DIR"
      - name: Validate run statuses
        run: python scripts/validate_live_pilot_statuses.py "$OUTPUT_DIR/runs.csv"
      - name: Upload Gemini evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cross-family-gemini-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 30
