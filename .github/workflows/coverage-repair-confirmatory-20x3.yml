name: Coverage-Repair Confirmatory 20x3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirmatory:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OUTPUT_DIR: results/coverage-repair-20x3-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Run coverage-repair regressions
        run: python -m unittest discover -s scripts -p "test_coverage_repair_context.py" -v

      - name: Run 20x3 confirmatory development grid
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY is missing" && exit 1)
          python scripts/run_coverage_repair_pilot.py \
            --model openai/gpt-5.6-sol \
            --development-suite \
            --repeats 3 \
            --max-actions 50 \
            --omit-temperature \
            --reasoning-effort medium \
            --output-dir "$OUTPUT_DIR"

      - name: Validate live execution
        run: python scripts/validate_live_pilot_statuses.py "$OUTPUT_DIR/runs.csv"

      - name: Validate exact 60-run grid
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import os
          from pathlib import Path

          expected_episodes = [
              "electrical-bongabon-generator-001",
              "electrical-national-museum-lighting-002",
              "electrical-neust-cable-003",
              "electrical-dla-breaker-004",
              "electrical-barrie-transformer-005",
              "electrical-bfar-generator-006",
              "electrical-negros-wire-007",
              "electrical-burauen-generator-008",
              "electrical-highpoint-transformer-009",
              "electrical-painesville-switchgear-010",
              "electrical-sagada-generator-011",
              "electrical-dla-relay-012",
              "electrical-dla-transformer-013",
              "electrical-dla-battery-supply-014",
              "electrical-dla-battery-charger-015",
              "electrical-dla-power-supply-016",
              "electrical-dla-qpl-breaker-017",
              "electrical-highpoint-cable-018",
              "electrical-usaf-ups-019",
              "electrical-vre-generator-020",
          ]
          expected_pairs = {
              (episode_id, repeat)
              for episode_id in expected_episodes
              for repeat in (1, 2, 3)
          }

          path = Path(os.environ["OUTPUT_DIR"]) / "runs.csv"
          rows = list(csv.DictReader(path.open(newline="", encoding="utf-8")))
          if len(rows) != 60:
              raise SystemExit(f"expected exactly 60 runs, got {len(rows)}")

          actual_pairs = []
          for row in rows:
              if row.get("model") != "openai/gpt-5.6-sol":
                  raise SystemExit(
                      f"unexpected model in confirmatory grid: {row.get('model')!r}"
                  )
              try:
                  repeat = int(row["repeat"])
              except (KeyError, TypeError, ValueError) as exc:
                  raise SystemExit(
                      f"invalid repeat label in confirmatory grid: {row.get('repeat')!r}"
                  ) from exc
              actual_pairs.append((row["episode_id"], repeat))

          if set(actual_pairs) != expected_pairs or len(set(actual_pairs)) != 60:
              missing = sorted(expected_pairs - set(actual_pairs))
              extra = sorted(set(actual_pairs) - expected_pairs)
              raise SystemExit(
                  "confirmatory grid does not match frozen episode/repeat pairs; "
                  f"missing={missing}, extra={extra}"
              )

          print("validated exact frozen episodes 001-020 x repeats 1,2,3")
          PY

      - name: Print confirmatory summary
        if: always()
        shell: bash
        run: |
          if [ -f "$OUTPUT_DIR/summary.json" ]; then
            cat "$OUTPUT_DIR/summary.json"
          fi
          if [ -f "$OUTPUT_DIR/coverage-repair-diagnostics.json" ]; then
            cat "$OUTPUT_DIR/coverage-repair-diagnostics.json"
          fi

      - name: Upload confirmatory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-repair-20x3-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 30
