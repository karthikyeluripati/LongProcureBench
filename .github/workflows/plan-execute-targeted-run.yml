name: Plan-and-Execute Targeted Pilot

on:
  push:
    branches:
      - codex/plan-execute-targeted-run

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUTPUT_DIR: results/plan-execute-targeted-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Plan-and-Execute regressions
        run: python -m unittest discover -s scripts -p "test_plan_execute_comparator.py" -v

      - name: Run targeted Plan-and-Execute pilot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY is missing" && exit 1)
          python scripts/run_plan_execute_comparator.py \
            --model openai/gpt-5.6-sol \
            --episode electrical-burauen-generator-008 \
            --episode electrical-dla-transformer-013 \
            --episode electrical-dla-power-supply-016 \
            --repeats 1 \
            --max-actions 20 \
            --omit-temperature \
            --reasoning-effort medium \
            --output-dir "$OUTPUT_DIR"

      - name: Validate execution and protocol activation
        shell: bash
        run: |
          python scripts/validate_live_pilot_statuses.py "$OUTPUT_DIR/runs.csv"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["OUTPUT_DIR"])
          payload = json.loads(
              (root / "plan-execute-diagnostics.json").read_text(encoding="utf-8")
          )
          rows = payload.get("per_run") or []
          if len(rows) != 3:
              raise SystemExit(f"expected 3 targeted runs, got {len(rows)}")
          bad = [row for row in rows if row.get("status") != "completed"]
          if bad:
              raise SystemExit(f"targeted runs did not all complete: {bad}")
          if any(row.get("planner_calls") != 1 for row in rows):
              raise SystemExit(f"expected exactly one planner call per run: {rows}")
          if any(row.get("plan_steps", 0) < 1 for row in rows):
              raise SystemExit(f"missing fixed plan in targeted run: {rows}")
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Print targeted summary
        if: always()
        shell: bash
        run: |
          if [ -f "$OUTPUT_DIR/summary.json" ]; then
            cat "$OUTPUT_DIR/summary.json"
          fi

      - name: Upload targeted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plan-execute-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 30
