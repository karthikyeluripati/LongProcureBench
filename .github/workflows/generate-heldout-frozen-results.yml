name: Generate Held-out Frozen Results Once

on:
  push:
    branches:
      - codex/freeze-heldout-paper-evidence-v0.1
    paths:
      - ".github/workflows/generate-heldout-frozen-results.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/freeze-heldout-paper-evidence-v0.1
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate and audit frozen held-out outputs
        run: python scripts/audit_heldout_paper_v01.py --write
      - name: Commit frozen held-out outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            evidence/heldout-paper-evaluation-v0.1/results.json \
            evidence/heldout-paper-evaluation-v0.1/failure-taxonomy.json \
            evidence/heldout-paper-evaluation-v0.1/results-manifest.json
          git diff --cached --exit-code && exit 0
          git commit -m "Freeze held-out paper results"
          git push origin HEAD:codex/freeze-heldout-paper-evidence-v0.1
