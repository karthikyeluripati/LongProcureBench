name: Materialize Durable ReAct Transcript

on:
  push:
    branches:
      - codex/freeze-react-comparator-v0.1
    paths:
      - ".github/workflows/materialize-react-transcript.yml"

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/freeze-react-comparator-v0.1
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Download exact source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p /tmp/react-artifact
          gh run download 36316652236 \
            --repo "$GITHUB_REPOSITORY" \
            --name react-comparator-36316652236-1 \
            --dir /tmp/react-artifact

      - name: Materialize durable replay, transcript, and provenance
        run: |
          python scripts/materialize_react_comparator_evidence_v01.py \
            --artifact-dir /tmp/react-artifact

      - name: Commit durable transcript evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            evidence/react-comparator-v0.1/replay-source.b64 \
            evidence/react-comparator-v0.1/transcript-source.b64 \
            evidence/react-comparator-v0.1/source-provenance.txt
          git diff --cached --exit-code && exit 0
          git commit -m "Preserve durable ReAct transcript evidence"
          git push origin HEAD:codex/freeze-react-comparator-v0.1
