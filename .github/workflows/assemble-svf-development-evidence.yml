name: Assemble SVF Development Evidence Chunks

on:
  push:
    branches:
      - codex/state-validity-frontier-development-v02-evidence
    paths:
      - '.github/workflows/assemble-svf-development-evidence.yml'

permissions:
  contents: write
  actions: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/state-validity-frontier-development-v02-evidence

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Download frozen source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10968521526/zip" > /tmp/svf-development.zip

      - name: Reconstruct checksum-locked replay chunks
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path
          import sys
          import zipfile

          root = Path.cwd()
          sys.path.insert(0, str(root / "scripts"))
          from frozen_state_validity_frontier_development_v02 import (
              EPISODES,
              canonical_line,
              compact_record_from_raw,
          )

          evidence = root / "evidence" / "state-validity-frontier-development-v0.2"
          manifest = json.loads((evidence / "manifest.json").read_text(encoding="utf-8"))
          expected_chunks = manifest["storage"]["chunks"]

          records = []
          with zipfile.ZipFile("/tmp/svf-development.zip") as archive:
              for name in archive.namelist():
                  if not name.endswith("/run-001.json") and not name.endswith("/run-002.json") and not name.endswith("/run-003.json"):
                      continue
                  raw = json.loads(archive.read(name))
                  repeat = int(Path(name).stem.split("-")[-1])
                  records.append(compact_record_from_raw(raw, repeat))

          records.sort(key=lambda row: (row["episode_id"], row["repeat"]))
          if len(records) != 60:
              raise SystemExit(f"expected 60 run records, got {len(records)}")

          rows = b"".join(canonical_line(row) for row in records)
          if len(rows) != manifest["storage"]["compact_rows_bytes"]:
              raise SystemExit("compact replay byte-count mismatch")
          if hashlib.sha256(rows).hexdigest() != manifest["storage"]["compact_rows_sha256"]:
              raise SystemExit("compact replay digest mismatch")

          compressed = gzip.compress(rows, compresslevel=9, mtime=0)
          if len(compressed) != manifest["storage"]["compressed_bytes"]:
              raise SystemExit("compressed replay byte-count mismatch")
          if hashlib.sha256(compressed).hexdigest() != manifest["storage"]["compressed_sha256"]:
              raise SystemExit("compressed replay digest mismatch")

          encoded = base64.b64encode(compressed)
          if len(encoded) != manifest["storage"]["encoded_bytes"]:
              raise SystemExit("encoded replay byte-count mismatch")
          if hashlib.sha256(encoded).hexdigest() != manifest["storage"]["encoded_sha256"]:
              raise SystemExit("encoded replay digest mismatch")

          offset = 0
          for meta in expected_chunks:
              size = int(meta["bytes"])
              payload = encoded[offset:offset + size]
              offset += size
              if hashlib.sha256(payload).hexdigest() != meta["sha256"]:
                  raise SystemExit(f"chunk digest mismatch: {meta['path']}")
              (evidence / meta["path"]).write_bytes(payload)
          if offset != len(encoded):
              raise SystemExit("chunk split did not consume encoded replay")
          print("reconstructed and verified all frozen replay chunks")
          PY

      - name: Commit evidence chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/state-validity-frontier-development-v0.2/replay-source.b64.part00                   evidence/state-validity-frontier-development-v0.2/replay-source.b64.part01                   evidence/state-validity-frontier-development-v0.2/replay-source.b64.part02
          if git diff --cached --quiet; then
            echo "No replay chunk changes to commit"
          else
            git commit -m "Add frozen SVF development replay chunks"
            git push origin HEAD:codex/state-validity-frontier-development-v02-evidence
          fi
