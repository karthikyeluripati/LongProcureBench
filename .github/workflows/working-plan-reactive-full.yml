name: Working Plan Reactive Full Run

on:
  workflow_dispatch:
  push:
    branches:
      - run-working-plan-full-20260926
    paths:
      - '.github/workflows/working-plan-reactive-full.yml'

permissions:
  contents: read

jobs:
  openai:
    name: GPT-5.6 Sol working-plan 20x3
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OUTPUT_DIR: results/working-plan-reactive-v0.1/openai-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Run working-plan regressions
        run: |
          python -m unittest discover -s scripts -p "test_working_plan_reactive.py" -v
          python -m unittest discover -s scripts -p "test_context_compiled_reactive.py" -v
          python -m unittest discover -s scripts -p "test_reactive_pilot.py" -v

      - name: Run GPT-5.6 Sol development-suite treatment
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY is missing" && exit 1)
          python scripts/run_working_plan_pilot.py \
            --model openai/gpt-5.6-sol \
            --development-suite \
            --repeats 3 \
            --max-actions 50 \
            --omit-temperature \
            --reasoning-effort medium \
            --output-dir "$OUTPUT_DIR"

      - name: Validate run statuses and evaluator coverage
        run: python scripts/validate_live_pilot_statuses.py "$OUTPUT_DIR/runs.csv"

      - name: Upload working-plan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: working-plan-reactive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 30
