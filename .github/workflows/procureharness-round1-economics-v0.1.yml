name: ProcureHarness Round 1 Offline Economics Gate v0.1

on:
  push:
    branches:
      - 'codex/procureharness-round1-economics-v0.1'
    paths:
      - '.github/workflows/procureharness-round1-economics-v0.1.yml'

permissions:
  contents: write

concurrency:
  group: procureharness-round1-economics-v0.1
  cancel-in-progress: false

jobs:
  economics:
    name: Freeze and evaluate Round 1 economics
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate refrozen ProcureHarness harness
        run: python scripts/validate_procureharness_harness_v01.py

      - name: Run offline ProcureHarness regressions
        run: python -m unittest discover -s scripts -p "test_procureharness*.py" -v

      - name: Refuse overwrite of existing economics package
        shell: bash
        run: |
          set -euo pipefail
          test ! -e evidence/procureharness-development-economics-v0.1

      - name: Materialize deterministic economics inputs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_procureharness_development_economics_v01.py prepare

      - name: Commit immutable economics descriptor and reports
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f evidence/procureharness-development-economics-v0.1
          git commit -m "Freeze ProcureHarness development economics inputs"
          freeze_commit="$(git rev-parse HEAD)"
          echo "freeze_commit=$freeze_commit" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:codex/procureharness-round1-economics-v0.1"
          echo "frozen development economics inputs at $freeze_commit"

      - name: Finalize manifest and apply frozen efficiency gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_procureharness_development_economics_v01.py             finalize             --freeze-commit "${{ steps.freeze.outputs.freeze_commit }}"

      - name: Run durable economics evidence audit
        run: |
          python -m unittest             scripts.test_procureharness_development_economics_v01 -v

      - name: Revalidate selector and harness after append
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_procureharness_harness_v01.py
          python -m unittest discover -s scripts -p "test_procureharness*.py" -v

      - name: Print frozen Round 1 efficiency outcome
        run: |
          cat evidence/procureharness-development-economics-v0.1/efficiency-gate-result.json

      - name: Commit durable economics result and retire one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git add -f evidence/procureharness-development-economics-v0.1

          shopt -s nullglob
          gate_files=(
            evidence/procureharness-search-gates-v0.1/validation-efficiency-addendum-round-1--*.json
            evidence/procureharness-search-gates-v0.1/*--validation-efficiency-auth.json
          )
          if [ ${#gate_files[@]} -gt 0 ]; then
            git add "${gate_files[@]}"
          fi

          git rm .github/workflows/procureharness-round1-economics-v0.1.yml
          git diff --cached --stat
          git commit -m "Freeze ProcureHarness Round 1 efficiency gate"
          git push origin "HEAD:codex/procureharness-round1-economics-v0.1"

      - name: Upload offline economics package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: procureharness-round1-economics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/procureharness-development-economics-v0.1
            evidence/procureharness-search-gates-v0.1/validation-efficiency-addendum-round-1--*.json
            evidence/procureharness-search-gates-v0.1/*--validation-efficiency-auth.json
          if-no-files-found: warn
          retention-days: 30
