name: Benchmark checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run benchmark, LLM-baseline, and pilot-harness regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate initial states
        run: python scripts/validate_dataset.py
      - name: Validate episodes
        run: python scripts/validate_episodes.py
      - name: Validate evaluation configs
        run: python scripts/validate_evaluation.py
      - name: Validate benchmark observability contract
        run: python scripts/validate_benchmark_contract.py
      - name: Validate fresh ProcureHarness observability
        run: python scripts/validate_procureharness_observability_v01.py
      - name: Audit frozen cross-family reactive evidence
        run: python scripts/audit_cross_family_reactive_v01.py --check
      - name: Audit frozen context-compiled evidence
        run: python scripts/audit_context_compiled_v01.py
      - name: Audit frozen operational-ledger evidence
        run: python scripts/audit_operational_ledger_v01.py
      - name: Audit frozen working-plan evidence
        run: python scripts/audit_working_plan_v01.py
      - name: Audit frozen always-replan verifier evidence
        run: python scripts/audit_always_replan_verifier_v01.py
      - name: Audit frozen progress-aware evidence
        run: python scripts/audit_progress_aware_v01.py
      - name: Audit frozen ReAct comparator evidence
        run: python scripts/audit_react_comparator_v01.py
      - name: Audit frozen Coverage + Repair confirmatory evidence
        run: python scripts/audit_coverage_repair_confirmatory_v01.py
      - name: Audit frozen State Validity Frontier Stage-1 evidence
        run: python scripts/audit_state_validity_frontier_stage1_v01.py
      - name: Audit frozen State Validity Frontier development v0.2 evidence
        run: python scripts/audit_state_validity_frontier_development_v02.py
      - name: Validate ProcureHarness architecture-search protocol
        run: python scripts/validate_procureharness_architecture_search_v01.py
      - name: Validate fresh ProcureHarness 031-050 package
        run: python scripts/validate_procureharness_fresh_package_v01.py
      - name: Validate frozen development comparator matrix
        run: python scripts/validate_development_comparator_matrix_v01.py
      - name: Validate frozen held-out episode package
        run: python scripts/validate_heldout_episode_package_v01.py
      - name: Validate frozen held-out execution plan
        run: python scripts/validate_heldout_execution_plan_v01.py
      - name: Audit frozen held-out paper evidence
        run: python scripts/audit_heldout_paper_v01.py
      - name: Run reference control integration check
        run: python scripts/run_reference.py --output-dir /tmp/longprocurebench-reference
      - name: Run fresh 031-050 reference integration check
        run: python scripts/run_fresh_reference.py --output-dir /tmp/longprocurebench-fresh-reference
