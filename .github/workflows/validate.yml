name: Benchmark checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run unit, runtime, evaluator, and runner regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate initial states
        run: python scripts/validate_dataset.py
      - name: Validate episodes
        run: python scripts/validate_episodes.py
      - name: Validate evaluation configs
        run: python scripts/validate_evaluation.py
      - name: Run reference control integration check
        run: python scripts/run_reference.py --output-dir /tmp/longprocurebench-reference
