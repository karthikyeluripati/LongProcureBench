name: Coverage-Repair Diagnostic 20x1

on:
  push:
    branches:
      - codex/coverage-repair-20x1-run

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OUTPUT_DIR: results/coverage-repair-20x1-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Run coverage-repair regressions
        run: python -m unittest discover -s scripts -p "test_coverage_repair_context.py" -v

      - name: Run 20x1 development diagnostic
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY is missing" && exit 1)
          python scripts/run_coverage_repair_pilot.py \
            --model openai/gpt-5.6-sol \
            --development-suite \
            --repeats 1 \
            --max-actions 50 \
            --omit-temperature \
            --reasoning-effort medium \
            --output-dir "$OUTPUT_DIR"

      - name: Validate live execution
        run: python scripts/validate_live_pilot_statuses.py "$OUTPUT_DIR/runs.csv"

      - name: Validate exact 20-run grid
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import os
          from pathlib import Path

          path = Path(os.environ["OUTPUT_DIR"]) / "runs.csv"
          rows = list(csv.DictReader(path.open(newline="", encoding="utf-8")))
          if len(rows) != 20:
              raise SystemExit(f"expected exactly 20 runs, got {len(rows)}")
          episodes = [row["episode_id"] for row in rows]
          if len(set(episodes)) != 20:
              raise SystemExit("development diagnostic must contain 20 unique episodes")
          print("validated 20 unique development runs")
          PY

      - name: Print diagnostic summary
        if: always()
        shell: bash
        run: |
          if [ -f "$OUTPUT_DIR/summary.json" ]; then
            cat "$OUTPUT_DIR/summary.json"
          fi
          if [ -f "$OUTPUT_DIR/coverage-repair-diagnostics.json" ]; then
            cat "$OUTPUT_DIR/coverage-repair-diagnostics.json"
          fi

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-repair-20x1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 30
