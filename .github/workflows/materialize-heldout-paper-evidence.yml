name: Materialize Held-out Paper Evidence Once

on:
  push:
    branches:
      - codex/freeze-heldout-paper-evidence-v0.1
    paths:
      - ".github/workflows/materialize-heldout-paper-evidence.yml"

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/freeze-heldout-paper-evidence-v0.1
          fetch-depth: 0

      - name: Download exact held-out source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/heldout-paper-evaluation-v0.1/source-artifacts

          download_artifact () {
            local id="$1"
            local name="$2"
            local expected_size="$3"
            local expected_sha="$4"
            local out="evidence/heldout-paper-evaluation-v0.1/source-artifacts/$name.zip"

            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
              --output "$out"

            test "$(wc -c < "$out" | tr -d ' ')" = "$expected_size"
            echo "$expected_sha  $out" | sha256sum --check -
          }

          download_artifact 10934782476 heldout-reference-control-36329287113 30675 13baa4585a098347fe418ce28732082e198ff6d1b4508df6a1e97fd7a257a2b4
          download_artifact 10935062553 heldout-raw-reactive-openai-36329287113 103221 7aca3f5ff235b391ea79b2d2e877837382365f929f29fda7ba309ca64cf81ddd
          download_artifact 10935671154 heldout-raw-reactive-anthropic-36329287113 101808 63825363ec04321de0c8b75596e932e394605a97999f5d35d5f3def667019a68
          download_artifact 10935288077 heldout-raw-reactive-gemini-36329287113 100872 107a696e1b744e877c6dd5170f8558a96e04da2aae604317792ced72227c4313
          download_artifact 10935671643 heldout-context-compiled-openai-36329287113 103738 1533556c1f59b338a53fd81dce7eb43e0d64dcdea19977b7e3c4e5f90aba6e20
          download_artifact 10935443329 heldout-react-openai-36329287113 142047 9c1448ad33b0db4a237cf62e6983d44de9f30fddf7aaff567503d0125db3fc11
          download_artifact 10935910728 heldout-paper-matrix-36329287113 9323 805ff7e625f564e263d772995df8d4407538f01401af1b91356f2cc565ea6e53

      - name: Commit exact source artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/heldout-paper-evaluation-v0.1/source-artifacts
          git diff --cached --exit-code && exit 0
          git commit -m "Preserve exact held-out source artifacts"
          git push origin HEAD:codex/freeze-heldout-paper-evidence-v0.1
