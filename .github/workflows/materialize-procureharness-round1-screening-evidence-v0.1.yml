name: Materialize ProcureHarness Round 1 Screening Evidence

on:
  push:
    branches:
      - 'codex/procureharness-round1-screening-evidence-v0.1'
    paths:
      - '.github/workflows/materialize-procureharness-round1-screening-evidence-v0.1.yml'

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: '36558900494'
      SOURCE_ARTIFACT: 'procureharness-round1-screening-package-36558900494-1'
      EVIDENCE_ROOT: evidence/procureharness-round1-screening-v0.1
      GATE_ROOT: evidence/procureharness-search-gates-v0.1

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Download exact successful Round 1 package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/procureharness-r1
          mkdir -p /tmp/procureharness-r1
          gh run download "$SOURCE_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "$SOURCE_ARTIFACT" \
            --dir /tmp/procureharness-r1

          test -f /tmp/procureharness-r1/procureharness-round1-screening-v0.1/manifest.json
          test -f /tmp/procureharness-r1/procureharness-search-gates-v0.1/screening-selection-round-1.json
          test -f /tmp/procureharness-r1/procureharness-search-gates-v0.1/ph-r1-c02--development-confirmation-auth.json
          test -f /tmp/procureharness-r1/procureharness-search-gates-v0.1/ph-r1-c05--development-confirmation-auth.json

      - name: Materialize package at frozen repository paths
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$EVIDENCE_ROOT"
          mkdir -p evidence
          cp -a /tmp/procureharness-r1/procureharness-round1-screening-v0.1 "$EVIDENCE_ROOT"

          mkdir -p "$GATE_ROOT"
          test ! -e "$GATE_ROOT/screening-selection-round-1.json"
          test ! -e "$GATE_ROOT/ph-r1-c02--development-confirmation-auth.json"
          test ! -e "$GATE_ROOT/ph-r1-c05--development-confirmation-auth.json"
          cp /tmp/procureharness-r1/procureharness-search-gates-v0.1/screening-selection-round-1.json "$GATE_ROOT/"
          cp /tmp/procureharness-r1/procureharness-search-gates-v0.1/ph-r1-c02--development-confirmation-auth.json "$GATE_ROOT/"
          cp /tmp/procureharness-r1/procureharness-search-gates-v0.1/ph-r1-c05--development-confirmation-auth.json "$GATE_ROOT/"

      - name: Verify exact manifest bytes and frozen selection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          manifest_path = Path("evidence/procureharness-round1-screening-v0.1/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          expected = {
              "schema_version": "0.1.0",
              "protocol_id": "procureharness-architecture-search-v0.1",
              "package_id": "procureharness-round1-screening-v0.1",
              "round": 1,
              "phase": "screening",
              "candidate_ids": [f"ph-r1-c{i:02d}" for i in range(1, 7)],
              "episode_suffixes": list(range(1, 21)),
              "repeats": 1,
              "total_runs": 120,
              "model": "openai/gpt-5.6-sol",
              "reasoning_effort": "medium",
              "temperature": None,
              "workflow_run_id": "36558900494",
              "workflow_run_attempt": "1",
              "workflow_commit_sha": "a67ea18f33fca2aebfb52621017c223127e20b21",
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(
                      f"manifest mismatch for {key}: "
                      f"{manifest.get(key)!r} != {value!r}"
                  )

          entries = [
              *manifest.get("source_files", []),
              *manifest.get("gate_files", []),
          ]
          if len(manifest.get("source_files", [])) != 126:
              raise SystemExit("expected exactly 126 source JSON files")
          if len(manifest.get("gate_files", [])) != 3:
              raise SystemExit("expected exactly 3 gate JSON files")

          for item in entries:
              path = Path(item["path"])
              if not path.is_file():
                  raise SystemExit(f"missing manifested file: {path}")
              raw = path.read_bytes()
              observed = hashlib.sha256(raw).hexdigest()
              if observed != item["sha256"]:
                  raise SystemExit(
                      f"SHA-256 mismatch for {path}: {observed} != {item['sha256']}"
                  )
              if len(raw) != item["bytes"]:
                  raise SystemExit(
                      f"byte-count mismatch for {path}: {len(raw)} != {item['bytes']}"
                  )

          raw_runs = list(
              Path("evidence/procureharness-round1-screening-v0.1/results")
              .glob("ph-r1-c*/screening/r1/*.json")
          )
          summaries = list(
              Path("evidence/procureharness-round1-screening-v0.1/results")
              .glob("ph-r1-c*/screening/summary.json")
          )
          if len(raw_runs) != 120 or len(summaries) != 6:
              raise SystemExit(
                  f"unexpected evidence cardinality: raw={len(raw_runs)}, summaries={len(summaries)}"
              )

          sys.path.insert(0, "scripts")
          from select_procureharness_screening_v01 import (
              validate_frozen_screening_selection,
          )
          from run_procureharness_search_v01 import validate_phase_authorization

          gate_root = Path("evidence/procureharness-search-gates-v0.1")
          selection_path = gate_root / "screening-selection-round-1.json"
          selection = json.loads(selection_path.read_text(encoding="utf-8"))
          validate_frozen_screening_selection(selection)

          selected = selection.get("selected_candidate_ids")
          if selected != ["ph-r1-c02", "ph-r1-c05"]:
              raise SystemExit(f"unexpected frozen selection: {selected}")

          for candidate_id in selected:
              auth_path = gate_root / f"{candidate_id}--development-confirmation-auth.json"
              authorization = json.loads(auth_path.read_text(encoding="utf-8"))
              validate_phase_authorization(
                  candidate_id=candidate_id,
                  phase="development_confirmation",
                  authorization=authorization,
              )

          print("verified exact Round 1 package: 120 runs, 6 summaries, C02+C05 selection")
          PY

      - name: Revalidate immutable ProcureHarness implementation freeze
        run: python scripts/validate_procureharness_harness_v01.py

      - name: Commit evidence-only final diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$EVIDENCE_ROOT"
          git add "$GATE_ROOT/screening-selection-round-1.json"
          git add "$GATE_ROOT/ph-r1-c02--development-confirmation-auth.json"
          git add "$GATE_ROOT/ph-r1-c05--development-confirmation-auth.json"
          git rm .github/workflows/materialize-procureharness-round1-screening-evidence-v0.1.yml

          git commit -m "Materialize ProcureHarness Round 1 screening evidence"
          git push origin "HEAD:codex/procureharness-round1-screening-evidence-v0.1"
