name: Luna 20-Episode Diagnostic

on:
  push:
    branches:
      - codex/luna-20-diagnostic
    paths:
      - '.github/workflows/luna20-diagnostic.yml'
      - 'scripts/summarize_luna20.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: 60-run Luna diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OUTPUT_DIR: results/luna20-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate frozen 20-episode benchmark
        run: |
          python scripts/validate_episodes.py
          python scripts/validate_evaluation.py

      - name: Run 60-run Luna diagnostic
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is not configured."
            exit 1
          fi

          episodes=(
            electrical-bongabon-generator-001
            electrical-national-museum-lighting-002
            electrical-neust-cable-003
            electrical-dla-breaker-004
            electrical-barrie-transformer-005
            electrical-bfar-generator-006
            electrical-negros-wire-007
            electrical-burauen-generator-008
            electrical-highpoint-transformer-009
            electrical-painesville-switchgear-010
            electrical-sagada-generator-011
            electrical-dla-relay-012
            electrical-dla-transformer-013
            electrical-dla-battery-supply-014
            electrical-dla-battery-charger-015
            electrical-dla-power-supply-016
            electrical-dla-qpl-breaker-017
            electrical-highpoint-cable-018
            electrical-usaf-ups-019
            electrical-vre-generator-020
          )

          episode_args=()
          for episode in "${episodes[@]}"; do
            episode_args+=(--episode "$episode")
          done

          python scripts/run_reactive_pilot.py \
            --model openai/gpt-5.6-luna \
            "${episode_args[@]}" \
            --omit-temperature \
            --reasoning-effort medium \
            --repeats 3 \
            --output-dir "$OUTPUT_DIR"

      - name: Validate 60-run execution matrix
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import os
          from collections import Counter
          from pathlib import Path

          path = Path(os.environ["OUTPUT_DIR"]) / "runs.csv"
          if not path.is_file():
              raise SystemExit("Diagnostic did not produce runs.csv")

          with path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))

          if len(rows) != 60:
              raise SystemExit(f"Expected 60 rows, found {len(rows)}")

          counts = Counter(row["episode_id"] for row in rows)
          if len(counts) != 20 or any(count != 3 for count in counts.values()):
              raise SystemExit(f"Unexpected episode/repeat matrix: {dict(counts)}")

          infrastructure_errors = {
              "environment_error",
              "setup_error",
              "evaluation_error",
              "metadata_error",
          }
          measured_policy_errors = {
              "EnvironmentError",
              "ValidationError",
              "RunnerError",
          }
          bad = [
              row for row in rows
              if row["status"] in infrastructure_errors
              or (
                  row["status"] == "policy_error"
                  and row["error_type"] not in measured_policy_errors
              )
          ]
          if bad:
              for row in bad:
                  print(
                      row["episode_id"],
                      row["repeat"],
                      row["status"],
                      row["error_type"],
                  )
              raise SystemExit(
                  f"{len(bad)} run(s) had infrastructure/provider errors"
              )

          print("Validated complete 20 x 3 diagnostic matrix.")
          PY

      - name: Build diagnostic comparison
        run: python scripts/summarize_luna20.py --input-dir "$OUTPUT_DIR"

      - name: Show diagnostic report
        run: cat "$OUTPUT_DIR/diagnostic-report.md"

      - name: Upload raw evidence and derived diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: luna20-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 30
