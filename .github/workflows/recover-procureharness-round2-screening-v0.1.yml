name: Recover ProcureHarness Round 2 Screening Evidence v0.1

on:
  push:
    branches:
      - 'codex/procureharness-round2-screening-v0.1'
    paths:
      - '.github/workflows/recover-procureharness-round2-screening-v0.1.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: recover-procureharness-round2-screening-v0.1
  cancel-in-progress: false

jobs:
  recover:
    name: Recover paid Round 2 screening artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      SOURCE_RUN_ID: '36585855832'
      SOURCE_RUN_ATTEMPT: '1'
      SOURCE_WORKFLOW_SHA: 'ff5cd8d1d4500ad44cd025795bfe95373e22219c'
      EVIDENCE_ROOT: evidence/procureharness-round2-screening-v0.1
      GATE_ROOT: evidence/procureharness-search-gates-v0.1

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Wait for all six already-paid screening jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            payload="$(
              gh api                 "repos/${{ github.repository }}/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100"
            )"
            count="$(jq '[.jobs[] | select(.name | startswith("Screen ph-r2-"))] | length' <<<"$payload")"
            completed="$(jq '[.jobs[] | select((.name | startswith("Screen ph-r2-")) and .status == "completed")] | length' <<<"$payload")"
            echo "paid screening jobs: count=$count completed=$completed"
            if [ "$count" -eq 6 ] && [ "$completed" -eq 6 ]; then
              failures="$(
                jq -r '
                  [.jobs[]
                    | select(.name | startswith("Screen ph-r2-"))
                    | select(.conclusion != "success")
                    | .name + "=" + (.conclusion // "null")]
                  | join(",")
                ' <<<"$payload"
              )"
              test -z "$failures" || {
                echo "paid screening job failure(s): $failures"
                exit 1
              }
              exit 0
            fi
            sleep 30
          done
          echo "timed out waiting for six paid screening jobs"
          exit 1

      - name: Download six existing screening artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: procureharness-r2-screening-*
          path: ${{ env.EVIDENCE_ROOT }}/results
          merge-multiple: true
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Validate recovered artifact grid before selection
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_procureharness_harness_v01.py
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")
          from run_procureharness_search_v01 import DEVELOPMENT_EPISODES

          root = Path(os.environ["EVIDENCE_ROOT"]) / "results"
          candidates = [f"ph-r2-c{i:02d}" for i in range(7, 13)]
          expected_names = {f"{episode_id}.json" for episode_id in DEVELOPMENT_EPISODES}
          for candidate in candidates:
              phase = root / candidate / "screening"
              summary_path = phase / "summary.json"
              if not summary_path.is_file():
                  raise SystemExit(f"missing recovered summary: {summary_path}")
              summary = json.loads(summary_path.read_text(encoding="utf-8"))
              if summary.get("candidate_id") != candidate:
                  raise SystemExit(f"{candidate}: summary candidate mismatch")
              if summary.get("round") != 2 or summary.get("phase") != "screening":
                  raise SystemExit(f"{candidate}: round/phase mismatch")
              if summary.get("planned_runs") != 20 or summary.get("completed_runs") != 20:
                  raise SystemExit(f"{candidate}: incomplete 20-run screening")
              if summary.get("execution_failures") != 0:
                  raise SystemExit(f"{candidate}: execution failures present")
              names = {
                  path.name
                  for path in (phase / "r1").glob("*.json")
              }
              if names != expected_names:
                  raise SystemExit(f"{candidate}: raw run grid mismatch")
          print("validated six recovered paid screening artifacts")
          PY

      - name: Freeze deterministic Round 2 selection
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$GATE_ROOT/screening-selection-round-2.json"
          python scripts/select_procureharness_screening_v01.py             --round 2             --results-root "$EVIDENCE_ROOT/results"             --output-dir "$GATE_ROOT"

      - name: Write durable Round 2 screening manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_ROOT"])
          gate = Path(os.environ["GATE_ROOT"])
          selection = json.loads(
              (gate / "screening-selection-round-2.json")
              .read_text(encoding="utf-8")
          )
          selected = selection["selected_candidate_ids"]

          def binding(path):
              raw = path.read_bytes()
              return {
                  "path": str(path),
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "bytes": len(raw),
              }

          source_files = [
              binding(path)
              for path in sorted(root.rglob("*.json"))
              if path.name != "manifest.json"
          ]
          input_authorization_files = [
              binding(gate / f"ph-r2-c{i:02d}--screening-auth.json")
              for i in range(7, 13)
          ]
          gate_files = [
              binding(gate / "screening-selection-round-2.json"),
              *[
                  binding(
                      gate / (
                          f"{candidate_id}"
                          "--development-confirmation-auth.json"
                      )
                  )
                  for candidate_id in selected
              ],
          ]

          manifest = {
              "schema_version": "0.1.0",
              "protocol_id": "procureharness-architecture-search-v0.1",
              "package_id": "procureharness-round2-screening-v0.1",
              "round": 2,
              "phase": "screening",
              "candidate_ids": [
                  f"ph-r2-c{i:02d}" for i in range(7, 13)
              ],
              "episode_suffixes": list(range(1, 21)),
              "repeats": 1,
              "total_runs": 120,
              "model": "openai/gpt-5.6-sol",
              "reasoning_effort": "medium",
              "temperature": None,
              "workflow_run_id": os.environ["SOURCE_RUN_ID"],
              "workflow_run_attempt": os.environ["SOURCE_RUN_ATTEMPT"],
              "workflow_commit_sha": os.environ["SOURCE_WORKFLOW_SHA"],
              "recovery_workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "source_files": source_files,
              "input_authorization_files": input_authorization_files,
              "gate_files": gate_files,
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run corrected durable evidence audit
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest             scripts.test_procureharness_round2_screening_evidence_v01 -v

      - name: Commit recovered evidence and retire workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f "$EVIDENCE_ROOT"
          git add "$GATE_ROOT/screening-selection-round-2.json"

          python - <<'PY' > /tmp/r2-selected.txt
          import json
          from pathlib import Path
          selection = json.loads(
              Path(
                  "evidence/procureharness-search-gates-v0.1/"
                  "screening-selection-round-2.json"
              ).read_text(encoding="utf-8")
          )
          for candidate_id in selection["selected_candidate_ids"]:
              print(candidate_id)
          PY

          while read -r candidate_id; do
            git add               "$GATE_ROOT/$candidate_id--development-confirmation-auth.json"
          done < /tmp/r2-selected.txt

          git rm             .github/workflows/procureharness-round2-screening-v0.1.yml             .github/workflows/recover-procureharness-round2-screening-v0.1.yml

          git diff --cached --stat
          git commit -m "Recover and freeze ProcureHarness Round 2 screening evidence"
          git push origin "HEAD:codex/procureharness-round2-screening-v0.1"
