name: Cross-Family Reactive Smoke

on:
  push:
    branches:
      - codex/cross-family-reactive-v0.1
    paths:
      - 'scripts/run_reactive_pilot.py'
      - 'scripts/test_reactive_pilot.py'
      - 'longprocurebench/litellm_client.py'
      - 'longprocurebench/reactive_llm.py'
      - '.github/workflows/cross-family-reactive-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SMOKE_ROOT: results/cross-family-reactive-smoke-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Run reactive harness regressions
        run: |
          python -m unittest discover -s scripts -p "test_reactive_llm.py" -v
          python -m unittest discover -s scripts -p "test_reactive_pilot.py" -v

      - name: Verify provider credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          for name in OPENAI_API_KEY ANTHROPIC_API_KEY GEMINI_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "$name repository secret is not configured."
              exit 1
            fi
          done
          echo "All three provider secrets are configured."

      - name: OpenAI one-episode smoke
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/run_reactive_pilot.py             --model openai/gpt-5.6-sol             --episode electrical-bongabon-generator-001             --repeats 1             --max-actions 12             --omit-temperature             --reasoning-effort medium             --output-dir "$SMOKE_ROOT/openai"

      - name: Anthropic one-episode smoke
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/run_reactive_pilot.py             --model anthropic/claude-opus-5-5             --episode electrical-bongabon-generator-001             --repeats 1             --max-actions 12             --omit-temperature             --output-dir "$SMOKE_ROOT/anthropic"

      - name: Gemini one-episode smoke
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/run_reactive_pilot.py             --model gemini/gemini-3.8-flash             --episode electrical-bongabon-generator-001             --repeats 1             --max-actions 12             --omit-temperature             --output-dir "$SMOKE_ROOT/gemini"

      - name: Summarize smoke costs and statuses
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["SMOKE_ROOT"])
          rows = []
          for provider in ("openai", "anthropic", "gemini"):
              path = root / provider / "runs.csv"
              if not path.is_file():
                  raise SystemExit(f"Missing smoke output: {path}")
              with path.open(newline="", encoding="utf-8") as handle:
                  provider_rows = list(csv.DictReader(handle))
              if len(provider_rows) != 1:
                  raise SystemExit(
                      f"Expected one smoke run for {provider}, "
                      f"found {len(provider_rows)}"
                  )
              row = provider_rows[0]
              rows.append(row)
              print(
                  f"{provider}: model={row['model']} status={row['status']} "
                  f"calls={row['model_calls']} tokens={row['total_tokens']} "
                  f"cost_usd={row['cost_usd']} "
                  f"obligation_success={row['feasible_obligation_success']}"
              )

          bad = [
              row for row in rows
              if row["status"] in {
                  "setup_error",
                  "evaluation_error",
                  "metadata_error",
              }
              or (
                  row["status"] == "policy_error"
                  and row["error_type"] not in {
                      "EnvironmentError",
                      "ValidationError",
                      "RunnerError",
                  }
              )
          ]
          known_costs = [
              float(row["cost_usd"])
              for row in rows
              if row["cost_usd"] not in ("", "None")
          ]
          summary = {
              "runs": len(rows),
              "known_cost_usd": sum(known_costs),
              "unknown_cost_runs": len(rows) - len(known_costs),
              "models": [
                  {
                      "model": row["model"],
                      "status": row["status"],
                      "model_calls": row["model_calls"],
                      "total_tokens": row["total_tokens"],
                      "cost_usd": row["cost_usd"],
                  }
                  for row in rows
              ],
          }
          (root / "smoke-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          if bad:
              raise SystemExit(
                  f"{len(bad)} provider smoke run(s) had infrastructure/model errors"
              )
          PY

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cross-family-reactive-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SMOKE_ROOT }}
          if-no-files-found: warn
          retention-days: 30
