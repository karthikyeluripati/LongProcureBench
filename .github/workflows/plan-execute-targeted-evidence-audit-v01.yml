name: Plan-and-Execute Targeted Evidence Audit

on:
  push:
    paths:
      - 'evidence/plan-execute-targeted-v0.1/**'
      - 'scripts/frozen_plan_execute_targeted_v01.py'
      - 'scripts/audit_plan_execute_targeted_v01.py'
      - 'scripts/verify_plan_execute_targeted_source_artifact_v01.py'
      - 'longprocurebench/evaluator.py'
      - 'longprocurebench/runtime.py'
      - 'data/episodes/electrical/electrical-burauen-generator-008.json'
      - 'data/episodes/electrical/electrical-dla-transformer-013.json'
      - 'data/episodes/electrical/electrical-dla-power-supply-016.json'
      - 'data/evaluation/electrical/electrical-burauen-generator-008.json'
      - 'data/evaluation/electrical/electrical-dla-transformer-013.json'
      - 'data/evaluation/electrical/electrical-dla-power-supply-016.json'
      - '.github/workflows/plan-execute-targeted-evidence-audit-v01.yml'
  pull_request:
    paths:
      - 'evidence/plan-execute-targeted-v0.1/**'
      - 'scripts/frozen_plan_execute_targeted_v01.py'
      - 'scripts/audit_plan_execute_targeted_v01.py'
      - 'scripts/verify_plan_execute_targeted_source_artifact_v01.py'
      - 'longprocurebench/evaluator.py'
      - 'longprocurebench/runtime.py'
      - 'data/episodes/electrical/electrical-burauen-generator-008.json'
      - 'data/episodes/electrical/electrical-dla-transformer-013.json'
      - 'data/episodes/electrical/electrical-dla-power-supply-016.json'
      - 'data/evaluation/electrical/electrical-burauen-generator-008.json'
      - 'data/evaluation/electrical/electrical-dla-transformer-013.json'
      - 'data/evaluation/electrical/electrical-dla-power-supply-016.json'
      - '.github/workflows/plan-execute-targeted-evidence-audit-v01.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Audit frozen Plan-and-Execute evidence
        run: python scripts/audit_plan_execute_targeted_v01.py
