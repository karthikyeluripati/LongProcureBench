name: Held-out Paper Evaluation v0.1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: Frozen held-out preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate frozen development matrix
        run: python scripts/validate_development_comparator_matrix_v01.py
      - name: Validate frozen held-out package
        run: python scripts/validate_heldout_episode_package_v01.py
      - name: Validate frozen execution protocol
        run: python scripts/validate_heldout_execution_plan_v01.py
      - name: Run held-out execution regressions
        run: python -m unittest discover -s scripts -p "test_heldout_execution.py" -v
      - name: Require all provider credentials before paid execution
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY is missing" && exit 1)
          test -n "$ANTHROPIC_API_KEY" || (echo "ANTHROPIC_API_KEY is missing" && exit 1)
          test -n "$GEMINI_API_KEY" || (echo "GEMINI_API_KEY is missing" && exit 1)

  reference-control:
    name: Reference control 10x1
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OUTPUT_DIR: results/heldout-paper-evaluation-v0.1/reference-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute frozen reference row
        run: |
          python -u scripts/run_heldout_paper_row.py \
            --row reference-control \
            --output-dir "$OUTPUT_DIR"
      - name: Validate exact reference evidence
        run: |
          python scripts/validate_heldout_row_results_v01.py \
            --row reference-control \
            --output-dir "$OUTPUT_DIR"
      - name: Upload reference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heldout-reference-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 30

  raw-openai:
    name: Raw reactive OpenAI 10x3
    needs: reference-control
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      OUTPUT_DIR: results/heldout-paper-evaluation-v0.1/raw-openai-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute frozen raw OpenAI row
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          python -u scripts/run_heldout_paper_row.py \
            --row raw-reactive-openai \
            --output-dir "$OUTPUT_DIR"
      - name: Validate exact raw OpenAI evidence
        run: |
          python scripts/validate_heldout_row_results_v01.py \
            --row raw-reactive-openai \
            --output-dir "$OUTPUT_DIR"
      - name: Upload raw OpenAI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heldout-raw-reactive-openai-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  raw-anthropic:
    name: Raw reactive Anthropic 10x3
    needs: reference-control
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      OUTPUT_DIR: results/heldout-paper-evaluation-v0.1/raw-anthropic-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute frozen raw Anthropic row
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          python -u scripts/run_heldout_paper_row.py \
            --row raw-reactive-anthropic \
            --output-dir "$OUTPUT_DIR"
      - name: Validate exact raw Anthropic evidence
        run: |
          python scripts/validate_heldout_row_results_v01.py \
            --row raw-reactive-anthropic \
            --output-dir "$OUTPUT_DIR"
      - name: Upload raw Anthropic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heldout-raw-reactive-anthropic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  raw-gemini:
    name: Raw reactive Gemini 10x3
    needs: reference-control
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      OUTPUT_DIR: results/heldout-paper-evaluation-v0.1/raw-gemini-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute frozen raw Gemini row
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          python -u scripts/run_heldout_paper_row.py \
            --row raw-reactive-gemini \
            --output-dir "$OUTPUT_DIR"
      - name: Validate exact raw Gemini evidence
        run: |
          python scripts/validate_heldout_row_results_v01.py \
            --row raw-reactive-gemini \
            --output-dir "$OUTPUT_DIR"
      - name: Upload raw Gemini evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heldout-raw-reactive-gemini-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  context-openai:
    name: Context-compiled OpenAI 10x3
    needs:
      - reference-control
      - raw-openai
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      OUTPUT_DIR: results/heldout-paper-evaluation-v0.1/context-openai-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute frozen context OpenAI row
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          python -u scripts/run_heldout_paper_row.py \
            --row context-compiled-openai \
            --output-dir "$OUTPUT_DIR"
      - name: Validate exact context OpenAI evidence
        run: |
          python scripts/validate_heldout_row_results_v01.py \
            --row context-compiled-openai \
            --output-dir "$OUTPUT_DIR"
      - name: Upload context OpenAI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heldout-context-compiled-openai-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  react-openai:
    name: ReAct OpenAI 10x3
    needs:
      - reference-control
      - context-openai
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      OUTPUT_DIR: results/heldout-paper-evaluation-v0.1/react-openai-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute frozen ReAct OpenAI row
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          python -u scripts/run_heldout_paper_row.py \
            --row react-openai \
            --output-dir "$OUTPUT_DIR"
      - name: Validate exact ReAct OpenAI evidence
        run: |
          python scripts/validate_heldout_row_results_v01.py \
            --row react-openai \
            --output-dir "$OUTPUT_DIR"
      - name: Upload ReAct OpenAI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heldout-react-openai-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    name: Validate complete 160-run matrix
    needs:
      - reference-control
      - raw-openai
      - raw-anthropic
      - raw-gemini
      - context-openai
      - react-openai
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Download reference row
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: heldout-reference-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: collected/reference-control
      - name: Download raw OpenAI row
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: heldout-raw-reactive-openai-${{ github.run_id }}-${{ github.run_attempt }}
          path: collected/raw-reactive-openai
      - name: Download raw Anthropic row
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: heldout-raw-reactive-anthropic-${{ github.run_id }}-${{ github.run_attempt }}
          path: collected/raw-reactive-anthropic
      - name: Download raw Gemini row
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: heldout-raw-reactive-gemini-${{ github.run_id }}-${{ github.run_attempt }}
          path: collected/raw-reactive-gemini
      - name: Download context OpenAI row
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: heldout-context-compiled-openai-${{ github.run_id }}-${{ github.run_attempt }}
          path: collected/context-compiled-openai
      - name: Download ReAct OpenAI row
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: heldout-react-openai-${{ github.run_id }}-${{ github.run_attempt }}
          path: collected/react-openai

      - name: Revalidate and aggregate complete frozen matrix
        run: |
          python scripts/aggregate_heldout_matrix_results_v01.py \
            --root collected \
            --output-dir aggregate

      - name: Upload aggregate held-out evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heldout-paper-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: aggregate
          if-no-files-found: error
          retention-days: 30
