name: State Validity Frontier Development v0.2

on:
  push:
    branches:
      - codex/state-validity-frontier-development-v02-run
    paths:
      - '.github/workflows/state-validity-frontier-development-v02-run.yml'

permissions:
  contents: read

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OUTPUT_DIR: results/state-validity-frontier-development-v0.2-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Run frozen development protocol regressions
        run: |
          python -m unittest discover -s scripts -p "test_state_validity_frontier_development_v02*.py" -v
          python -m unittest discover -s scripts -p "test_state_validity_frontier.py" -v

      - name: Verify frozen executable hashes before paid execution
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          root = Path.cwd()
          sys.path.insert(0, str(root / "scripts"))
          from run_state_validity_frontier_development_v02 import validate_frozen_implementation
          print(json.dumps(validate_frozen_implementation(), indent=2, sort_keys=True))
          PY

      - name: Run exact frozen 20x3 development grid
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY is missing" && exit 1)
          python scripts/run_state_validity_frontier_development_v02.py             --output-dir "$OUTPUT_DIR"

      - name: Print development summary
        if: always()
        shell: bash
        run: |
          if [ -f "$OUTPUT_DIR/summary.json" ]; then
            cat "$OUTPUT_DIR/summary.json"
          fi
          if [ -f "$OUTPUT_DIR/prerequisite-sequence-gate.json" ]; then
            cat "$OUTPUT_DIR/prerequisite-sequence-gate.json"
          fi

      - name: Upload complete development evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: state-validity-frontier-development-v0.2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 30
