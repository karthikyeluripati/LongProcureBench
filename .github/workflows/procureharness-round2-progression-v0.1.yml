name: Freeze ProcureHarness Round 2 Progression v0.1

on:
  push:
    branches:
      - 'codex/procureharness-round2-progression-v0.1'
    paths:
      - '.github/workflows/procureharness-round2-progression-v0.1.yml'

permissions:
  contents: write

concurrency:
  group: procureharness-round2-progression-v0.1
  cancel-in-progress: false

jobs:
  progression:
    name: Freeze Round 1 to Round 2 progression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate refrozen ProcureHarness implementation
        run: python scripts/validate_procureharness_harness_v01.py

      - name: Run offline ProcureHarness regressions
        run: python -m unittest discover -s scripts -p "test_procureharness*.py" -v

      - name: Preview frozen Round 2 progression
        run: |
          python scripts/select_procureharness_round_progression_v01.py             --completed-round 1             --preview

      - name: Freeze Round 2 screening authorization
        run: |
          python scripts/select_procureharness_round_progression_v01.py             --completed-round 1             --output-dir evidence/procureharness-search-gates-v0.1

      - name: Revalidate progression and all six screening authorizations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")
          from run_procureharness_search_v01 import (
              DEVELOPMENT_EPISODES,
              phase_plan,
              round_candidate_ids,
              validate_phase_authorization,
          )
          from select_procureharness_round_progression_v01 import (
              validate_frozen_round_progression,
          )

          gate = Path("evidence/procureharness-search-gates-v0.1")
          progression = json.loads(
              (gate / "round-progression-after-round-1.json")
              .read_text(encoding="utf-8")
          )
          validate_frozen_round_progression(progression)

          expected = round_candidate_ids(2)
          if progression["screening_authorized_candidate_ids"] != expected:
              raise SystemExit("Round-2 authorized candidate set drifted")
          if progression["consecutive_no_new_frontier_rounds"] != 1:
              raise SystemExit("Round-1 plateau count must equal one")
          if progression["stop_search"] is not False:
              raise SystemExit("Round-1 stop rule unexpectedly fired")

          for candidate_id in expected:
              auth_path = gate / f"{candidate_id}--screening-auth.json"
              authorization = json.loads(
                  auth_path.read_text(encoding="utf-8")
              )
              validate_phase_authorization(
                  candidate_id=candidate_id,
                  phase="screening",
                  authorization=authorization,
              )
              plan = phase_plan(candidate_id, "screening")
              if plan["run_count"] != 20:
                  raise SystemExit(
                      f"{candidate_id}: expected 20 screening runs"
                  )
              suffixes = [
                  int(row["episode_id"].rsplit("-", 1)[1])
                  for row in plan["runs"]
              ]
              if suffixes != list(range(1, 21)):
                  raise SystemExit(
                      f"{candidate_id}: screening grid drift"
                  )

          print("validated frozen Round-2 screening authorization for C07-C12")
          PY

      - name: Commit durable progression gate and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             evidence/procureharness-search-gates-v0.1/round-progression-after-round-1.json             evidence/procureharness-search-gates-v0.1/ph-r2-c07--screening-auth.json             evidence/procureharness-search-gates-v0.1/ph-r2-c08--screening-auth.json             evidence/procureharness-search-gates-v0.1/ph-r2-c09--screening-auth.json             evidence/procureharness-search-gates-v0.1/ph-r2-c10--screening-auth.json             evidence/procureharness-search-gates-v0.1/ph-r2-c11--screening-auth.json             evidence/procureharness-search-gates-v0.1/ph-r2-c12--screening-auth.json

          git rm .github/workflows/procureharness-round2-progression-v0.1.yml
          git diff --cached --stat
          git commit -m "Freeze ProcureHarness Round 2 screening authorization"
          git push origin "HEAD:codex/procureharness-round2-progression-v0.1"
