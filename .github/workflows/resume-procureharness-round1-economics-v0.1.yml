name: Resume ProcureHarness Round 1 Offline Economics Gate v0.1

on:
  push:
    branches:
      - 'codex/procureharness-round1-economics-v0.1'
    paths:
      - '.github/workflows/resume-procureharness-round1-economics-v0.1.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify frozen input snapshot still matches
        shell: bash
        run: |
          set -euo pipefail
          test -f evidence/procureharness-development-economics-v0.1/binding.json
          test ! -e evidence/procureharness-development-economics-v0.1/manifest.json
          for path in             evidence/procureharness-development-economics-v0.1/binding.json             evidence/procureharness-development-economics-v0.1/coverage-repair-reports.json             evidence/procureharness-development-economics-v0.1/react-reports.json             evidence/procureharness-development-economics-v0.1/ph-r1-c02-reports.json             evidence/procureharness-development-economics-v0.1/ph-r1-c05-reports.json             evidence/procureharness-development-economics-v0.1/reference-cohort.json             evidence/procureharness-development-economics-v0.1/comparisons.json
          do
            current="$(git hash-object "$path")"
            frozen="$(git rev-parse "7b101f08eb2ad2ca33df628e30fd3c3173befc32:$path")"
            test "$current" = "$frozen"
          done

      - name: Finalize manifest and frozen efficiency outcome
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_procureharness_development_economics_v01.py             finalize             --freeze-commit 7b101f08eb2ad2ca33df628e30fd3c3173befc32

      - name: Run durable economics audit
        run: |
          python -m unittest             scripts.test_procureharness_development_economics_v01 -v

      - name: Run full ProcureHarness regression suite
        run: python -m unittest discover -s scripts -p "test_procureharness*.py" -v

      - name: Print frozen outcome
        run: cat evidence/procureharness-development-economics-v0.1/efficiency-gate-result.json

      - name: Commit final offline economics evidence and retire workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f evidence/procureharness-development-economics-v0.1

          shopt -s nullglob
          gate_files=(
            evidence/procureharness-search-gates-v0.1/validation-efficiency-addendum-round-1--*.json
            evidence/procureharness-search-gates-v0.1/*--validation-efficiency-auth.json
          )
          if [ ${#gate_files[@]} -gt 0 ]; then
            git add "${gate_files[@]}"
          fi

          git rm .github/workflows/procureharness-round1-economics-v0.1.yml
          git rm .github/workflows/resume-procureharness-round1-economics-v0.1.yml

          git commit -m "Freeze ProcureHarness Round 1 offline economics outcome"
          git push origin "HEAD:codex/procureharness-round1-economics-v0.1"
