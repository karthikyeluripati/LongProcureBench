name: ProcureHarness Round 1 Screening v0.1

on:
  push:
    branches:
      - 'codex/procureharness-round1-screening-v0.1'
    paths:
      - '.github/workflows/procureharness-round1-screening-v0.1.yml'
  # Intentionally no workflow_dispatch: Round 1 screening is a one-time,
  # preregistered paid execution. The successful run is frozen by #55.

permissions:
  contents: read
  actions: read

concurrency:
  group: procureharness-round1-screening-v0.1
  cancel-in-progress: false

jobs:
  preflight:
    name: Frozen ProcureHarness preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Refuse execution after Round 1 is frozen
        shell: bash
        run: |
          set -euo pipefail
          selection="evidence/procureharness-search-gates-v0.1/screening-selection-round-1.json"
          manifest="evidence/procureharness-round1-screening-v0.1/manifest.json"
          if [ -e "$selection" ] || [ -e "$manifest" ]; then
            echo "Round 1 screening is already frozen; refusing any rerun before paid execution."
            echo "selection=$selection"
            echo "manifest=$manifest"
            exit 1
          fi

      - name: Validate immutable ProcureHarness implementation freeze
        run: python scripts/validate_procureharness_harness_v01.py

      - name: Run ProcureHarness offline regressions
        run: python -m unittest discover -s scripts -p "test_procureharness*.py" -v

      - name: Validate exact Round 1 screening plans
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/procureharness-plans
          for candidate in             ph-r1-c01 ph-r1-c02 ph-r1-c03             ph-r1-c04 ph-r1-c05 ph-r1-c06
          do
            python scripts/run_procureharness_search_v01.py               --candidate "$candidate"               --phase screening               --plan-output "/tmp/procureharness-plans/$candidate.json"               >/dev/null
          done

          python - <<'PY'
          import json
          from pathlib import Path

          candidates = [f"ph-r1-c{i:02d}" for i in range(1, 7)]
          expected_suffixes = list(range(1, 21))
          for candidate in candidates:
              payload = json.loads(
                  (Path("/tmp/procureharness-plans") / f"{candidate}.json")
                  .read_text(encoding="utf-8")
              )
              if payload["run_count"] != 20:
                  raise SystemExit(f"{candidate}: expected 20 planned runs")
              if payload["round"] != 1 or payload["phase"] != "screening":
                  raise SystemExit(f"{candidate}: wrong frozen phase/round")
              if payload["model"] != "openai/gpt-5.6-sol":
                  raise SystemExit(f"{candidate}: wrong frozen model")
              if payload["reasoning_effort"] != "medium":
                  raise SystemExit(f"{candidate}: wrong reasoning effort")
              if payload["temperature"] is not None:
                  raise SystemExit(f"{candidate}: temperature must be omitted")
              rows = payload["runs"]
              suffixes = [
                  int(row["episode_id"].rsplit("-", 1)[1])
                  for row in rows
              ]
              repeats = [row["repeat"] for row in rows]
              if suffixes != expected_suffixes or repeats != [1] * 20:
                  raise SystemExit(f"{candidate}: screening grid drift")
          print("validated six frozen Round 1 candidates x episodes 001-020 x1")
          PY

      - name: Require OpenAI credential before paid execution
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY is missing" && exit 1)

  screening:
    name: Screen ${{ matrix.candidate }} on 001-020 x1
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        candidate:
          - ph-r1-c01
          - ph-r1-c02
          - ph-r1-c03
          - ph-r1-c04
          - ph-r1-c05
          - ph-r1-c06
    env:
      CANDIDATE: ${{ matrix.candidate }}
      OUTPUT_DIR: results/procureharness-architecture-search-v0.1

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Execute frozen Round 1 screening candidate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY is missing" && exit 1)
          python -u scripts/run_procureharness_search_v01.py             --candidate "$CANDIDATE"             --phase screening             --execute             --output-dir "$OUTPUT_DIR"

      - name: Validate exact candidate screening evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")
          from run_procureharness_search_v01 import DEVELOPMENT_EPISODES

          candidate = os.environ["CANDIDATE"]
          root = Path(os.environ["OUTPUT_DIR"]) / candidate / "screening"
          summary_path = root / "summary.json"
          if not summary_path.is_file():
              raise SystemExit(f"missing summary: {summary_path}")

          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          if summary.get("candidate_id") != candidate:
              raise SystemExit("screening candidate mismatch")
          if summary.get("round") != 1 or summary.get("phase") != "screening":
              raise SystemExit("screening round/phase mismatch")
          if summary.get("model") != "openai/gpt-5.6-sol":
              raise SystemExit("screening model drift")
          if summary.get("reasoning_effort") != "medium":
              raise SystemExit("screening reasoning-effort drift")
          if summary.get("temperature") is not None:
              raise SystemExit("screening temperature drift")
          if summary.get("planned_runs") != 20:
              raise SystemExit("screening planned_runs must equal 20")
          if summary.get("completed_runs") != 20:
              raise SystemExit("screening must complete exactly 20 runs")
          if summary.get("execution_failures") != 0:
              raise SystemExit("screening contains execution failures")

          rows = summary.get("rows")
          if not isinstance(rows, list) or len(rows) != 20:
              raise SystemExit("screening summary must contain 20 rows")
          observed = [
              (row.get("episode_id"), row.get("repeat"))
              for row in rows
          ]
          expected = [(episode_id, 1) for episode_id in DEVELOPMENT_EPISODES]
          if observed != expected:
              raise SystemExit("screening summary grid does not match 001-020 x1")

          run_files = sorted((root / "r1").glob("*.json"))
          if len(run_files) != 20:
              raise SystemExit(f"expected 20 raw run files, got {len(run_files)}")
          expected_files = sorted(f"{episode_id}.json" for episode_id in DEVELOPMENT_EPISODES)
          if [path.name for path in run_files] != expected_files:
              raise SystemExit("raw screening run filenames do not match frozen grid")

          print(f"validated {candidate}: exact 20-run screening evidence")
          PY

      - name: Stage candidate evidence
        if: always()
        shell: bash
        run: |
          rm -rf artifact
          mkdir -p artifact
          if [ -d "$OUTPUT_DIR/$CANDIDATE" ]; then
            cp -a "$OUTPUT_DIR/$CANDIDATE" "artifact/$CANDIDATE"
          fi

      - name: Upload candidate screening evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: procureharness-r1-screening-${{ matrix.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact
          if-no-files-found: error
          retention-days: 30

  freeze-selection:
    name: Freeze Round 1 screening selection
    needs: screening
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVIDENCE_ROOT: evidence/procureharness-round1-screening-v0.1
      GATE_ROOT: evidence/procureharness-search-gates-v0.1

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Download all six screening artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: procureharness-r1-screening-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}/results
          merge-multiple: true

      - name: Revalidate frozen harness before selection
        run: python scripts/validate_procureharness_harness_v01.py

      - name: Freeze deterministic Round 1 selection and authorizations
        shell: bash
        run: |
          set -euo pipefail
          python scripts/select_procureharness_screening_v01.py             --round 1             --results-root "$EVIDENCE_ROOT/results"             --output-dir "$GATE_ROOT"
          rm -f "$GATE_ROOT/.screening-selection-round-1.lock"

      - name: Revalidate frozen selection and authorization bindings
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")
          from run_procureharness_search_v01 import validate_phase_authorization
          from select_procureharness_screening_v01 import validate_frozen_screening_selection

          gate_root = Path(os.environ["GATE_ROOT"])
          selection_path = gate_root / "screening-selection-round-1.json"
          selection = json.loads(selection_path.read_text(encoding="utf-8"))
          validate_frozen_screening_selection(selection)

          selected = selection["selected_candidate_ids"]
          if len(selected) != 2:
              raise SystemExit(f"expected exactly two selected candidates, got {selected}")

          for candidate_id in selected:
              auth_path = gate_root / f"{candidate_id}--development-confirmation-auth.json"
              authorization = json.loads(auth_path.read_text(encoding="utf-8"))
              validate_phase_authorization(
                  candidate_id=candidate_id,
                  phase="development_confirmation",
                  authorization=authorization,
              )

          print("selected Round 1 candidates:", ", ".join(selected))
          PY

      - name: Write durable screening evidence manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_ROOT"])
          gate_root = Path(os.environ["GATE_ROOT"])

          source_files = []
          for path in sorted(root.rglob("*.json")):
              if path.name == "manifest.json":
                  continue
              raw = path.read_bytes()
              source_files.append({
                  "path": str(path),
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "bytes": len(raw),
              })

          gate_files = []
          for path in sorted(gate_root.glob("*.json")):
              raw = path.read_bytes()
              gate_files.append({
                  "path": str(path),
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "bytes": len(raw),
              })

          manifest = {
              "schema_version": "0.1.0",
              "protocol_id": "procureharness-architecture-search-v0.1",
              "package_id": "procureharness-round1-screening-v0.1",
              "round": 1,
              "phase": "screening",
              "candidate_ids": [f"ph-r1-c{i:02d}" for i in range(1, 7)],
              "episode_suffixes": list(range(1, 21)),
              "repeats": 1,
              "total_runs": 120,
              "model": "openai/gpt-5.6-sol",
              "reasoning_effort": "medium",
              "temperature": None,
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "workflow_commit_sha": os.environ["GITHUB_SHA"],
              "source_files": source_files,
              "gate_files": gate_files,
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(
              f"manifested {len(source_files)} screening JSON files and "
              f"{len(gate_files)} gate JSON files"
          )
          PY

      - name: Print frozen Round 1 selection
        run: cat "$GATE_ROOT/screening-selection-round-1.json"

      - name: Upload complete Round 1 screening package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: procureharness-round1-screening-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.EVIDENCE_ROOT }}
            ${{ env.GATE_ROOT }}/screening-selection-round-1.json
            ${{ env.GATE_ROOT }}/*--development-confirmation-auth.json
          if-no-files-found: error
          retention-days: 30
