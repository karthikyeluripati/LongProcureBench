name: ProcureHarness Round 2 Offline Economics Gate v0.1

on:
  push:
    branches:
      - 'codex/procureharness-round2-economics-v0.1'
    paths:
      - '.github/workflows/procureharness-round2-economics-v0.1.yml'

permissions:
  contents: write

concurrency:
  group: procureharness-round2-economics-v0.1
  cancel-in-progress: false

jobs:
  economics:
    name: Score and freeze Round 2 economics
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate frozen ProcureHarness harness
        run: python scripts/validate_procureharness_harness_v01.py

      - name: Run offline ProcureHarness regressions
        run: python -m unittest discover -s scripts -p "test_procureharness*.py" -v

      - name: Refuse overwrite of frozen Round 2 economics
        shell: bash
        run: |
          set -euo pipefail
          test ! -e evidence/procureharness-round2-economics-v0.1
          test ! -e evidence/procureharness-search-gates-v0.1/validation-efficiency-addendum-round-2--ph-r2-c12.json
          test ! -e evidence/procureharness-search-gates-v0.1/validation-efficiency-addendum-round-2--ph-r2-c09.json
          test ! -e evidence/procureharness-search-gates-v0.1/ph-r2-c12--validation-efficiency-auth.json
          test ! -e evidence/procureharness-search-gates-v0.1/ph-r2-c09--validation-efficiency-auth.json

      - name: Materialize and apply Round 2 offline economics gate
        run: python scripts/materialize_procureharness_round2_economics_v01.py

      - name: Run durable Round 2 economics audit
        run: |
          python -m unittest             scripts.test_procureharness_round2_economics_v01 -v

      - name: Revalidate full ProcureHarness regressions
        run: python -m unittest discover -s scripts -p "test_procureharness*.py" -v

      - name: Print frozen Round 2 efficiency outcome
        run: cat evidence/procureharness-round2-economics-v0.1/efficiency-gate-result.json

      - name: Commit durable Round 2 economics evidence and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add evidence/procureharness-round2-economics-v0.1

          shopt -s nullglob
          gate_files=(
            evidence/procureharness-search-gates-v0.1/validation-efficiency-addendum-round-2--*.json
            evidence/procureharness-search-gates-v0.1/ph-r2-c09--validation-efficiency-auth.json
            evidence/procureharness-search-gates-v0.1/ph-r2-c12--validation-efficiency-auth.json
          )
          if [ ${#gate_files[@]} -gt 0 ]; then
            git add "${gate_files[@]}"
          fi

          git rm .github/workflows/procureharness-round2-economics-v0.1.yml
          git diff --cached --stat
          git commit -m "Freeze ProcureHarness Round 2 efficiency gate"
          git push origin "HEAD:codex/procureharness-round2-economics-v0.1"

      - name: Upload Round 2 economics package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: procureharness-round2-economics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/procureharness-round2-economics-v0.1
            evidence/procureharness-search-gates-v0.1/validation-efficiency-addendum-round-2--*.json
            evidence/procureharness-search-gates-v0.1/ph-r2-c09--validation-efficiency-auth.json
            evidence/procureharness-search-gates-v0.1/ph-r2-c12--validation-efficiency-auth.json
          if-no-files-found: warn
          retention-days: 30
