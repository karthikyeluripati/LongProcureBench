name: Pilot Trajectory Rescore

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub Actions run ID containing the raw OpenAI pilot artifact
        required: true
        default: '36159375317'
      source_run_attempt:
        description: Optional run attempt; leave empty to discover the latest artifact
        required: false
        default: ''
  push:
    branches:
      - main
      - codex/pilot-rescore-v0.1
    paths:
      - 'scripts/rescore_pilot.py'
      - 'scripts/test_rescore_pilot.py'
      - 'scripts/run_reactive_pilot.py'
      - 'longprocurebench/evaluator.py'
      - 'data/episodes/electrical/**'
      - '.github/workflows/pilot-rescore.yml'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id || '36159375317' }}
      SOURCE_RUN_ATTEMPT: ${{ github.event.inputs.source_run_attempt || '' }}
      RAW_DIR: raw-pilot
      AUDIT_DIR: audited-pilot

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run rescore regression tests
        run: python -m unittest discover -s scripts -p "test_rescore_pilot.py" -v

      - name: Download raw pilot artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -n "$SOURCE_RUN_ATTEMPT" ]; then
            artifact="openai-reactive-pilot-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}"
          else
            prefix="openai-reactive-pilot-${SOURCE_RUN_ID}-"
            artifact="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" \
                --paginate \
                --jq ".artifacts[] | select(.name | startswith(\"$prefix\")) | [.created_at, .name] | @tsv" \
              | sort \
              | tail -n 1 \
              | cut -f2-
            )"
          fi

          if [ -z "$artifact" ]; then
            echo "No OpenAI pilot artifact found for run $SOURCE_RUN_ID."
            exit 1
          fi

          echo "Downloading artifact: $artifact"
          mkdir -p "$RAW_DIR"
          gh run download "$SOURCE_RUN_ID" --name "$artifact" --dir "$RAW_DIR"

      - name: Rescore saved trajectories
        run: |
          python scripts/rescore_pilot.py \
            --input-dir "$RAW_DIR" \
            --output-dir "$AUDIT_DIR"

      - name: Show audited taxonomy
        run: |
          cat "$AUDIT_DIR/failure-taxonomy.json"
          cat "$AUDIT_DIR/summary.json"

      - name: Upload audited evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audited-pilot-${{ env.SOURCE_RUN_ID }}-${{ github.run_id }}
          path: ${{ env.AUDIT_DIR }}
          if-no-files-found: error
          retention-days: 30
